<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>STS Online - SDN 1 Jatipayak</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container">

        <div class="login-card">

            <div class="logo">
                🎓
            </div>

            <h1>
                STS ONLINE
            </h1>

            <p class="school">
                SD Negeri 1 Jatipayak
            </p>

            <p class="subtitle">
                Sistem Sumatif Tengah Semester
            </p>


            <form id="loginForm">

                <label for="nama">
                    Nama Peserta Didik
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama lengkap"
                >


                <label for="nomor">
                    Nomor Peserta
                </label>

                <input
                    type="text"
                    id="nomor"
                    placeholder="Masukkan nomor peserta"
                >


                <label for="token">
                    Token Ujian
                </label>

                <input
                    type="text"
                    id="token"
                    placeholder="Masukkan token ujian"
                >


                <button type="submit">
                    MASUK UJIAN
                </button>

            </form>


            <div class="footer">
                © 2026 SD Negeri 1 Jatipayak
            </div>

        </div>

    </div>

</body>

</html>
