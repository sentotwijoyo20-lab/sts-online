<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login Siswa - STS Online</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="login-page">


    <div class="login-card">


        <div class="login-icon">
            👨‍🎓
        </div>


        <h2>
            LOGIN SISWA
        </h2>


        <p class="school-name">
            SD Negeri 1 Jatipayak
        </p>


        <div
            id="modeBadge"
            class="mode-badge mode-gladi">

            🟢 GLADI / SIMULASI

        </div>


        <div class="form-group">

            <label for="nama">
                Nama Lengkap
            </label>

            <input
                id="nama"
                type="text"
                placeholder="Masukkan nama lengkap">

        </div>


        <div class="form-group">

            <label for="nis">
                NIS / Nomor Peserta
            </label>

            <input
                id="nis"
                type="text"
                placeholder="Masukkan NIS / nomor peserta">

        </div>


        <div class="form-group">

            <label for="token">
                Token Ujian
            </label>

            <input
                id="token"
                type="text"
                placeholder="Masukkan token ujian">

        </div>


        <button
            class="login-button"
            onclick="mulaiLogin()">

            MASUK KE UJIAN

        </button>


        <button
            class="back-button"
            onclick="kembaliKeBeranda()">

            ← Kembali ke Beranda

        </button>


    </div>

</div>


<script src="script.js"></script>


<script>

    /*
       Membaca mode dari URL.
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const mode =
        params.get("mode");


    const badge =
        document.getElementById(
            "modeBadge"
        );


    if (mode === "resmi") {

        badge.textContent =
            "🔵 STS RESMI";

        badge.className =
            "mode-badge mode-resmi";

    } else {

        badge.textContent =
            "🟢 GLADI / SIMULASI";

        badge.className =
            "mode-badge mode-gladi";

    }

</script>


</body>

</html>
