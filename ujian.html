<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ruang Ujian - STS Online</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="exam-page">


    <!-- HEADER UJIAN -->

    <header class="exam-header">

        <div>

            <h1>STS ONLINE</h1>

            <p>SD Negeri 1 Jatipayak</p>

        </div>


        <div class="student-info">

            <strong id="namaSiswa">
                Siswa
            </strong>

            <span id="modeUjian">
                GLADI / SIMULASI
            </span>

        </div>


        <div class="timer-box">

            <span>⏱️ Sisa Waktu</span>

            <strong id="timer">
                30:00
            </strong>

        </div>

    </header>



    <!-- ISI UJIAN -->

    <main class="exam-layout">


        <!-- SOAL -->

        <section class="question-area">


            <div class="question-card">

                <div class="question-top">

                    <span id="questionNumber">
                        Soal 1 dari 5
                    </span>

                    <span id="questionStatus">
                        Belum dijawab
                    </span>

                </div>


                <h2 id="questionText">
                    Memuat soal...
                </h2>


                <div
                    id="options"
                    class="options">
                </div>


                <div class="question-actions">

                    <button
                        id="previousButton"
                        class="nav-button"
                        onclick="soalSebelumnya()">

                        ← Sebelumnya

                    </button>


                    <button
                        id="doubtButton"
                        class="doubt-button"
                        onclick="toggleRagu()">

                        🟡 Ragu-ragu

                    </button>


                    <button
                        id="nextButton"
                        class="nav-button"
                        onclick="soalBerikutnya()">

                        Berikutnya →

                    </button>

                </div>

            </div>


            <!-- TOMBOL SELESAI -->

            <button
                class="finish-button"
                onclick="konfirmasiSelesai()">

                📝 SELESAI & KIRIM JAWABAN

            </button>

        </section>



        <!-- PANEL NOMOR SOAL -->

        <aside class="question-panel">

            <h3>
                Daftar Soal
            </h3>


            <div
                id="questionNumbers"
                class="question-numbers">
            </div>


            <div class="legend">

                <div>
                    <span class="legend-box answered"></span>
                    Sudah dijawab
                </div>

                <div>
                    <span class="legend-box doubt"></span>
                    Ragu-ragu
                </div>

                <div>
                    <span class="legend-box current"></span>
                    Soal aktif
                </div>

                <div>
                    <span class="legend-box empty"></span>
                    Belum dijawab
                </div>

            </div>

        </aside>

    </main>



<script>


/* =============================== */
/* DATA SISWA */
/* =============================== */

const nama =
    localStorage.getItem("namaSiswa") || "Siswa";

const mode =
    localStorage.getItem("modeUjian") || "gladi";


document.getElementById("namaSiswa").textContent =
    nama;


if (mode === "resmi") {

    document.getElementById("modeUjian").textContent =
        "🔵 STS RESMI";

} else {

    document.getElementById("modeUjian").textContent =
        "🟢 GLADI / SIMULASI";

}



/* =============================== */
/* DATA SOAL SEMENTARA */
/* =============================== */

const soal = [

    {
        pertanyaan:
            "Lambang negara Indonesia adalah ...",

        pilihan: [
            "Garuda Pancasila",
            "Bendera Merah Putih",
            "Burung Merpati",
            "Pohon Beringin"
        ],

        jawaban:
            "Garuda Pancasila"
    },


    {
        pertanyaan:
            "Bunyi sila pertama Pancasila adalah ...",

        pilihan: [
            "Persatuan Indonesia",
            "Ketuhanan Yang Maha Esa",
            "Keadilan Sosial",
            "Kemanusiaan yang Adil dan Beradab"
        ],

        jawaban:
            "Ketuhanan Yang Maha Esa"
    },


    {
        pertanyaan:
            "Contoh sikap menjaga persatuan di sekolah adalah ...",

        pilihan: [
            "Bertengkar dengan teman",
            "Mengejek teman",
            "Bermain bersama tanpa membeda-bedakan",
            "Memilih-milih teman"
        ],

        jawaban:
            "Bermain bersama tanpa membeda-bedakan"
    },


    {
        pertanyaan:
            "Sebelum makan sebaiknya kita ...",

        pilihan: [
            "Bermain",
            "Mencuci tangan",
            "Tidur",
            "Berlari"
        ],

        jawaban:
            "Mencuci tangan"
    },


    {
        pertanyaan:
            "Jika mendapat bantuan dari teman, kita sebaiknya mengatakan ...",

        pilihan: [
            "Pergi!",
            "Tidak mau!",
            "Terima kasih",
            "Jangan!"
        ],

        jawaban:
            "Terima kasih"
    }

];



/* =============================== */
/* VARIABEL UJIAN */
/* =============================== */

let soalSekarang = 0;

let jawabanSiswa = [];

let soalRagu = [];

let waktu = 30 * 60;



/* =============================== */
/* TAMPILKAN SOAL */
/* =============================== */

function tampilkanSoal() {


    const data =
        soal[soalSekarang];


    document.getElementById("questionNumber")
        .textContent =
        "Soal " +
        (soalSekarang + 1) +
        " dari " +
        soal.length;


    document.getElementById("questionText")
        .textContent =
        data.pertanyaan;


    const options =
        document.getElementById("options");


    options.innerHTML = "";


    data.pilihan.forEach(
        function(pilihan, index) {


            const label =
                document.createElement("label");


            label.className =
                "option";


            if (
                jawabanSiswa[soalSekarang]
                === pilihan
            ) {

                label.classList.add(
                    "selected"
                );

            }


            label.innerHTML =

                '<input type="radio" ' +

                'name="jawaban" ' +

                'value="' +
                pilihan +
                '">' +

                '<span class="option-letter">' +

                String.fromCharCode(
                    65 + index
                ) +

                '</span>' +

                '<span>' +
                pilihan +
                '</span>';


            const radio =
                label.querySelector(
                    "input"
                );


            radio.addEventListener(
                "change",
                function() {

                    simpanJawaban(
                        pilihan
                    );

                }
            );


            options.appendChild(label);

        }
    );


    updateStatus();

    updateNavigation();

    updateQuestionNumbers();

}



/* =============================== */
/* SIMPAN JAWABAN */
/* =============================== */

function simpanJawaban(jawaban) {

    jawabanSiswa[soalSekarang] =
        jawaban;


    localStorage.setItem(
        "jawabanSTS",
        JSON.stringify(
            jawabanSiswa
        )
    );


    tampilkanSoal();

}



/* =============================== */
/* RAGU-RAGU */
/* =============================== */

function toggleRagu() {


    if (
        soalRagu.includes(
            soalSekarang
        )
    ) {

        soalRagu =
            soalRagu.filter(
                function(item) {

                    return item !==
                        soalSekarang;

                }
            );

    } else {

        soalRagu.push(
            soalSekarang
        );

    }


    updateStatus();

    updateQuestionNumbers();

}



/* =============================== */
/* STATUS */
/* =============================== */

function updateStatus() {


    const status =
        document.getElementById(
            "questionStatus"
        );


    if (
        soalRagu.includes(
            soalSekarang
        )
    ) {

        status.textContent =
            "🟡 Ragu-ragu";

        status.className =
            "status-doubt";


    } else if (
        jawabanSiswa[soalSekarang]
    ) {

        status.textContent =
            "✓ Sudah dijawab";

        status.className =
            "status-answered";


    } else {

        status.textContent =
            "Belum dijawab";

        status.className =
            "status-empty";

    }

}



/* =============================== */
/* NAVIGASI */
/* =============================== */

function soalSebelumnya() {


    if (
        soalSekarang > 0
    ) {

        soalSekarang--;

        tampilkanSoal();

    }

}



function soalBerikutnya() {


    if (
        soalSekarang <
        soal.length - 1
    ) {

        soalSekarang++;

        tampilkanSoal();

    }

}



/* =============================== */
/* NOMOR SOAL */
/* =============================== */

function updateQuestionNumbers() {


    const container =
        document.getElementById(
            "questionNumbers"
        );


    container.innerHTML = "";


    soal.forEach(
        function(_, index) {


            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                index + 1;


            button.className =
                "number-button";


            if (
                index === soalSekarang
            ) {

                button.classList.add(
                    "current"
                );

            }


            if (
                jawabanSiswa[index]
            ) {

                button.classList.add(
                    "answered"
                );

            }


            if (
                soalRagu.includes(index)
            ) {

                button.classList.add(
                    "doubt"
                );

            }


            button.onclick =
                function() {

                    soalSekarang =
                        index;

                    tampilkanSoal();

                };


            container.appendChild(
                button
            );

        }
    );

}



/* =============================== */
/* NAVIGATION BUTTON */
/* =============================== */

function updateNavigation() {


    document.getElementById(
        "previousButton"
    ).disabled =
        soalSekarang === 0;


    document.getElementById(
        "nextButton"
    ).disabled =
        soalSekarang ===
        soal.length - 1;

}



/* =============================== */
/* TIMER */
/* =============================== */

function mulaiTimer() {


    const timer =
        document.getElementById(
            "timer"
        );


    const interval =
        setInterval(
            function() {


                let menit =
                    Math.floor(
                        waktu / 60
                    );


                let detik =
                    waktu % 60;


                timer.textContent =

                    String(menit)
                        .padStart(2, "0")

                    + ":" +

                    String(detik)
                        .padStart(2, "0");


                if (
                    waktu <= 0
                ) {

                    clearInterval(
                        interval
                    );


                    alert(
                        "Waktu ujian telah habis."
                    );


                    kirimJawaban();

                    return;

                }


                waktu--;

            },
            1000
        );

}



/* =============================== */
/* SELESAI */
/* =============================== */

function konfirmasiSelesai() {


    const jumlahDijawab =
        jawabanSiswa.filter(
            Boolean
        ).length;


    const belum =
        soal.length -
        jumlahDijawab;


    const yakin =
        confirm(

            "Apakah Anda yakin ingin " +
            "mengakhiri ujian?\n\n" +

            "Sudah dijawab: " +
            jumlahDijawab +
            " soal\n" +

            "Belum dijawab: " +
            belum +
            " soal\n\n" +

            "Jawaban yang sudah dikirim " +
            "tidak dapat diubah."

        );


    if (yakin) {

        kirimJawaban();

    }

}



/* =============================== */
/* KIRIM JAWABAN */
/* =============================== */

function kirimJawaban() {


    let benar = 0;


    soal.forEach(
        function(data, index) {


            if (
                jawabanSiswa[index]
                === data.jawaban
            ) {

                benar++;

            }

        }
    );


    const nilai =
        Math.round(
            (benar / soal.length) *
            100
        );


    localStorage.setItem(
        "nilaiSTS",
        nilai
    );


    localStorage.setItem(
        "jumlahBenar",
        benar
    );


    window.location.href =
        "hasil.html";

}



/* =============================== */
/* MULAI */
/* =============================== */

tampilkanSoal();

mulaiTimer();

</script>


</body>

</html>
```
