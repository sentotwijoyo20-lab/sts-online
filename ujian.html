<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ruang Ujian - STS Online</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="exam-page">


<header class="exam-header">


    <div>

        <h1>
            STS ONLINE
        </h1>

        <p>
            SD Negeri 1 Jatipayak
        </p>

    </div>


    <div class="student-info">

        <strong id="namaTampil">
            Siswa
        </strong>

        <span id="modeTampil">
            🟢 GLADI / SIMULASI
        </span>

    </div>


    <div class="timer-box">

        <span>
            ⏱️ Sisa Waktu
        </span>

        <strong id="timer">
            30:00
        </strong>

    </div>


</header>


<main class="exam-layout">


    <section>


        <div class="question-card">


            <div class="question-top">

                <span id="nomorSoal">
                    Soal 1 dari 5
                </span>

                <span id="statusSoal">
                    Belum dijawab
                </span>

            </div>


            <h2 id="pertanyaan">
                Memuat soal...
            </h2>


            <div
                id="pilihan"
                class="options">
            </div>


            <div class="question-actions">


                <button
                    id="prevButton"
                    class="nav-button"
                    onclick="sebelumnya()">

                    ← Sebelumnya

                </button>


                <button
                    class="doubt-button"
                    onclick="toggleRagu()">

                    🟡 Ragu-ragu

                </button>


                <button
                    id="nextButton"
                    class="nav-button"
                    onclick="berikutnya()">

                    Berikutnya →

                </button>


            </div>


        </div>


        <button
            class="finish-button"
            onclick="selesaiUjian()">

            📝 SELESAI & KIRIM JAWABAN

        </button>


    </section>


    <aside class="question-panel">


        <h3>
            Daftar Soal
        </h3>


        <div
            id="nomorPanel"
            class="question-numbers">
        </div>


        <div class="legend">

            <div>
                <span
                    class="legend-box answered">
                </span>

                Sudah dijawab
            </div>


            <div>
                <span
                    class="legend-box doubt">
                </span>

                Ragu-ragu
            </div>


            <div>
                <span
                    class="legend-box current">
                </span>

                Soal aktif
            </div>


            <div>
                <span
                    class="legend-box empty">
                </span>

                Belum dijawab
            </div>

        </div>


    </aside>


</main>


<script src="script.js"></script>


<script>


/* =========================================
   DATA SOAL GLADI
========================================= */

const soalGladi = [

    {
        pertanyaan:
            "Lambang negara Indonesia adalah ...",

        pilihan: [
            "Garuda Pancasila",
            "Burung Merpati",
            "Pohon Beringin",
            "Bendera Merah Putih"
        ],

        jawaban:
            "Garuda Pancasila"
    },


    {
        pertanyaan:
            "Bunyi sila pertama Pancasila adalah ...",

        pilihan: [
            "Persatuan Indonesia",
            "Ketuhanan Yang Maha Esa",
            "Keadilan Sosial",
            "Kemanusiaan yang Adil dan Beradab"
        ],

        jawaban:
            "Ketuhanan Yang Maha Esa"
    },


    {
        pertanyaan:
            "Contoh menjaga persatuan di sekolah adalah ...",

        pilihan: [
            "Mengejek teman",
            "Bertengkar",
            "Bermain bersama tanpa membeda-bedakan",
            "Memilih-milih teman"
        ],

        jawaban:
            "Bermain bersama tanpa membeda-bedakan"
    },


    {
        pertanyaan:
            "Sebelum makan sebaiknya kita ...",

        pilihan: [
            "Bermain",
            "Mencuci tangan",
            "Tidur",
            "Berlari"
        ],

        jawaban:
            "Mencuci tangan"
    },


    {
        pertanyaan:
            "Jika mendapat bantuan dari teman, kita sebaiknya mengatakan ...",

        pilihan: [
            "Pergi!",
            "Jangan!",
            "Terima kasih",
            "Tidak mau!"
        ],

        jawaban:
            "Terima kasih"
    }

];


/* =========================================
   MODE
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const mode =
    localStorage.getItem("modeUjian")
    || params.get("mode")
    || "gladi";


/* =========================================
   DATA SISWA
========================================= */

const nama =
    localStorage.getItem(
        "namaSiswa"
    ) || "Siswa";


document.getElementById(
    "namaTampil"
).textContent = nama;


if (mode === "resmi") {

    document.getElementById(
        "modeTampil"
    ).textContent =
        "🔵 STS RESMI";

} else {

    document.getElementById(
        "modeTampil"
    ).textContent =
        "🟢 GLADI / SIMULASI";

}


/* =========================================
   SOAL
========================================= */

const soal =
    soalGladi;


let sekarang = 0;


let jawaban =
    [];


let ragu =
    [];


let waktu =
    30 * 60;


/* =========================================
   TAMPILKAN SOAL
========================================= */

function tampilkanSoal() {


    const data =
        soal[sekarang];


    document.getElementById(
        "nomorSoal"
    ).textContent =
        "Soal " +
        (sekarang + 1) +
        " dari " +
        soal.length;


    document.getElementById(
        "pertanyaan"
    ).textContent =
        data.pertanyaan;


    const pilihan =
        document.getElementById(
            "pilihan"
        );


    pilihan.innerHTML = "";


    data.pilihan.forEach(
        function(item, index) {


            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "option";


            if (
                jawaban[sekarang]
                === item
            ) {

                label.classList.add(
                    "selected"
                );

            }


            label.innerHTML =
                '<input type="radio">' +

                '<span class="option-letter">' +

                String.fromCharCode(
                    65 + index
                ) +

                '</span>' +

                '<span>' +
                item +
                '</span>';


            label.onclick =
                function() {

                    jawaban[sekarang] =
                        item;

                    simpanData();

                    tampilkanSoal();

                };


            pilihan.appendChild(
                label
            );

        }
    );


    updateStatus();

    updatePanel();

    updateNavigation();

}


/* =========================================
   SIMPAN DATA
========================================= */

function simpanData() {

    localStorage.setItem(
        "jawabanSTS",
        JSON.stringify(jawaban)
    );

}


/* =========================================
   STATUS
========================================= */

function updateStatus() {

    const status =
        document.getElementById(
            "statusSoal"
        );


    if (
        ragu.includes(sekarang)
    ) {

        status.textContent =
            "🟡 Ragu-ragu";

    } else if (
        jawaban[sekarang]
    ) {

        status.textContent =
            "✓ Sudah dijawab";

    } else {

        status.textContent =
            "Belum dijawab";

    }

}


/* =========================================
   RAGU-RAGU
========================================= */

function toggleRagu() {

    if (
        ragu.includes(sekarang)
    ) {

        ragu =
            ragu.filter(
                item =>
                    item !== sekarang
            );

    } else {

        ragu.push(
            sekarang
        );

    }


    updateStatus();

    updatePanel();

}


/* =========================================
   PANEL NOMOR
========================================= */

function updatePanel() {

    const panel =
        document.getElementById(
            "nomorPanel"
        );


    panel.innerHTML = "";


    soal.forEach(
        function(_, index) {


            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                index + 1;


            button.className =
                "number-button";


            if (
                jawaban[index]
            ) {

                button.classList.add(
                    "answered"
                );

            }


            if (
                ragu.includes(index)
            ) {

                button.classList.add(
                    "doubt"
                );

            }


            if (
                index === sekarang
            ) {

                button.classList.add(
                    "current"
                );

            }


            button.onclick =
                function() {

                    sekarang =
                        index;

                    tampilkanSoal();

                };


            panel.appendChild(
                button
            );

        }
    );

}


/* =========================================
   NAVIGASI
========================================= */

function sebelumnya() {

    if (sekarang > 0) {

        sekarang--;

        tampilkanSoal();

    }

}


function berikutnya() {

    if (
        sekarang <
        soal.length - 1
    ) {

        sekarang++;

        tampilkanSoal();

    }

}


function updateNavigation() {

    document.getElementById(
        "prevButton"
    ).disabled =
        sekarang === 0;


    document.getElementById(
        "nextButton"
    ).disabled =
        sekarang ===
        soal.length - 1;

}


/* =========================================
   TIMER
========================================= */

function mulaiTimer() {

    const timer =
        document.getElementById(
            "timer"
        );


    const interval =
        setInterval(
            function() {


                const menit =
                    Math.floor(
                        waktu / 60
                    );


                const detik =
                    waktu % 60;


                timer.textContent =
                    String(menit)
                        .padStart(2, "0")
                    +
                    ":" +
                    String(detik)
                        .padStart(2, "0");


                if (
                    waktu <= 0
                ) {

                    clearInterval(
                        interval
                    );


                    kirimJawaban();

                    return;

                }


                waktu--;

            },
            1000
        );

}


/* =========================================
   SELESAI
========================================= */

function selesaiUjian() {

    const jumlah =
        jawaban.filter(
            Boolean
        ).length;


    const belum =
        soal.length -
        jumlah;


    const yakin =
        confirm(
            "Apakah Anda yakin ingin mengakhiri ujian?\n\n" +
            "Sudah dijawab: " +
            jumlah +
            " soal\n" +
            "Belum dijawab: " +
            belum +
            " soal"
        );


    if (yakin) {

        kirimJawaban();

    }

}


/* =========================================
   HITUNG NILAI
========================================= */

function kirimJawaban() {

    let benar = 0;


    soal.forEach(
        function(data, index) {

            if (
                jawaban[index]
                === data.jawaban
            ) {

                benar++;

            }

        }
    );


    const nilai =
        Math.round(
            benar /
            soal.length *
            100
        );


    localStorage.setItem(
        "nilaiSTS",
        nilai
    );


    localStorage.setItem(
        "jumlahBenar",
        benar
    );


    localStorage.setItem(
        "jumlahSoal",
        soal.length
    );


    window.location.href =
        "hasil.html";

}


/* =========================================
   MULAI
========================================= */

tampilkanSoal();

mulaiTimer();

</script>


</body>

</html>
