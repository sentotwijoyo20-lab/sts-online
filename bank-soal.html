<script>

/* =========================================================
   VARIABEL
========================================================= */

let hasilImport = [];


/* =========================================================
   EVENT PILIH FILE
========================================================= */

document.getElementById("wordFile").addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    bacaFileWord(file);

});


/* =========================================================
   BACA FILE DOCX
========================================================= */

async function bacaFileWord(file) {

    sembunyikanPesan();

    const loading =
        document.getElementById("loading");

    const fileInfo =
        document.getElementById("fileInfo");

    fileInfo.style.display = "block";

    fileInfo.innerHTML =
        "📄 <strong>File:</strong> " +
        escapeHtml(file.name) +
        "<br>" +
        "📦 <strong>Ukuran:</strong> " +
        formatBytes(file.size);

    loading.style.display = "block";


    try {

        const arrayBuffer =
            await file.arrayBuffer();

        const zip =
            await JSZip.loadAsync(arrayBuffer);


        const documentFile =
            zip.file("word/document.xml");

        if (!documentFile) {
            throw new Error(
                "Dokumen Word tidak memiliki document.xml."
            );
        }


        const documentXmlText =
            await documentFile.async("text");


        const parser =
            new DOMParser();


        const xml =
            parser.parseFromString(
                documentXmlText,
                "application/xml"
            );


        const parserError =
            xml.querySelector("parsererror");


        if (parserError) {

            throw new Error(
                "Struktur XML Word tidak dapat dibaca."
            );

        }


        /* =====================================================
           RELASI GAMBAR
        ===================================================== */

        const rels = {};

        const relsFile =
            zip.file(
                "word/_rels/document.xml.rels"
            );


        if (relsFile) {

            const relsText =
                await relsFile.async("text");


            const relsXml =
                parser.parseFromString(
                    relsText,
                    "application/xml"
                );


            const relationshipNodes =
                relsXml.getElementsByTagName(
                    "Relationship"
                );


            for (
                const rel of relationshipNodes
            ) {

                const id =
                    rel.getAttribute("Id");

                const target =
                    rel.getAttribute("Target");


                if (
                    id &&
                    target
                ) {

                    let targetName =
                        target.replace(
                            /^.*media\//,
                            ""
                        );

                    rels[id] =
                        targetName;

                }

            }

        }


        /* =====================================================
           BACA GAMBAR
        ===================================================== */

        const images = {};


        for (
            const filename of Object.keys(zip.files)
        ) {

            if (
                !filename.startsWith(
                    "word/media/"
                )
            ) {
                continue;
            }


            const imageFile =
                zip.file(filename);


            if (!imageFile) {
                continue;
            }


            const blob =
                await imageFile.async("blob");


            const mime =
                getImageMime(filename);


            const dataUrl =
                await blobToDataUrl(
                    blob,
                    mime
                );


            const shortName =
                filename.replace(
                    "word/media/",
                    ""
                );


            images[shortName] =
                dataUrl;

        }


        /* =====================================================
           AMBIL PARAGRAF WORD
        ===================================================== */

        const paragraphs =
            Array.from(
                xml.getElementsByTagName(
                    "w:p"
                )
            );


        const data = [];


        for (
            const paragraph of paragraphs
        ) {

            const item =
                await prosesParagraf(
                    paragraph,
                    rels,
                    images
                );


            if (
                item.text.trim() !== "" ||
                item.images.length > 0
            ) {

                data.push(item);

            }

        }


        /* =====================================================
           PARSE SOAL
        ===================================================== */

        const questions =
            parseDokumenSoal(data);


        hasilImport =
            questions;


        loading.style.display = "none";


        tampilkanPreview(
            questions
        );


        tampilkanSukses(
            "File Word berhasil dibaca. " +
            "Ditemukan " +
            questions.length +
            " soal."
        );


    } catch (error) {

        loading.style.display = "none";


        tampilkanError(
            "Gagal membaca file Word: " +
            error.message
        );


        console.error(error);

    }

}


/* =========================================================
   PROSES PARAGRAF WORD
========================================================= */

async function prosesParagraf(
    paragraph,
    rels,
    images
) {

    let text = "";


    const textNodes =
        paragraph.getElementsByTagName(
            "w:t"
        );


    for (
        const node of textNodes
    ) {

        text +=
            node.textContent || "";

    }


    const imageElements = [];


    const blips =
        paragraph.getElementsByTagName(
            "a:blip"
        );


    for (
        const blip of blips
    ) {

        const relationId =
            blip.getAttribute(
                "r:embed"
            );


        if (!relationId) {
            continue;
        }


        const filename =
            rels[relationId];


        if (!filename) {
            continue;
        }


        if (images[filename]) {

            imageElements.push(
                images[filename]
            );

        }

    }


    return {

        text: text,

        images: imageElements

    };

}


/* =========================================================
   PARSER UTAMA SOAL
========================================================= */

function parseDokumenSoal(data) {

    const questions = [];

    let currentQuestion = null;

    let currentSection = "";


    for (
        const item of data
    ) {

        let text =
            normalisasiSpasi(
                item.text
            );


        if (!text && item.images.length === 0) {
            continue;
        }


        /* =================================================
           DETEKSI BAGIAN
        ================================================= */

        const upper =
            text.toUpperCase();


        if (
            upper.includes(
                "I. PILIHAN GANDA"
            ) ||
            upper === "PILIHAN GANDA"
        ) {

            currentSection =
                "pilihan";

            continue;

        }


        if (
            upper.includes(
                "II. ISIAN SINGKAT"
            ) ||
            upper === "ISIAN SINGKAT"
        ) {

            currentSection =
                "isian";

            currentQuestion = null;

            continue;

        }


        if (
            upper.includes(
                "III. URAIAN"
            ) ||
            upper === "URAIAN"
        ) {

            currentSection =
                "uraian";

            currentQuestion = null;

            continue;

        }


        if (
            upper === "KUNCI JAWABAN" ||
            upper.startsWith(
                "KUNCI JAWABAN"
            )
        ) {

            currentSection =
                "kunci";

            currentQuestion = null;

            continue;

        }


        /* =================================================
           ABAIKAN PETUNJUK
        ================================================= */

        if (
            upper.startsWith(
                "PETUNJUK UMUM"
            ) ||
            upper.startsWith(
                "PETUNJUK KHUSUS"
            )
        ) {

            continue;

        }


        /* =================================================
           KUNCI JAWABAN
        ================================================= */

        if (
            currentSection === "kunci"
        ) {

            continue;

        }


        /* =================================================
           PILIHAN GANDA
        ================================================= */

        if (
            currentSection === "pilihan"
        ) {

            prosesBarisPilihanGanda(
                text,
                item.images,
                questions,
                () => currentQuestion,
                value => {
                    currentQuestion = value;
                }
            );

            continue;

        }


        /* =================================================
           ISIAN
        ================================================= */

        if (
            currentSection === "isian"
        ) {

            const nomor =
                text.match(
                    /^(\d+)[\.\)]\s*(.*)$/
                );


            if (nomor) {

                currentQuestion = {

                    nomor: nomor[1],

                    text: nomor[2],

                    images:
                        [...item.images],

                    options: [],

                    jenis: "isian"

                };


                questions.push(
                    currentQuestion
                );

            } else if (
                currentQuestion
            ) {

                if (text) {

                    currentQuestion.text +=
                        " " +
                        text;

                }


                currentQuestion.images.push(
                    ...item.images
                );

            }


            continue;

        }


        /* =================================================
           URAIAN
        ================================================= */

        if (
            currentSection === "uraian"
        ) {

            const nomor =
                text.match(
                    /^(\d+)[\.\)]\s*(.*)$/
                );


            if (nomor) {

                currentQuestion = {

                    nomor: nomor[1],

                    text: nomor[2],

                    images:
                        [...item.images],

                    options: [],

                    jenis: "uraian"

                };


                questions.push(
                    currentQuestion
                );

            } else if (
                currentQuestion
            ) {

                if (text) {

                    currentQuestion.text +=
                        " " +
                        text;

                }


                currentQuestion.images.push(
                    ...item.images
                );

            }


            continue;

        }

    }


    return questions;

}


/* =========================================================
   PROSES PILIHAN GANDA
========================================================= */

function prosesBarisPilihanGanda(
    text,
    images,
    questions,
    getCurrentQuestion,
    setCurrentQuestion
) {

    /*
     * Hapus bagian "Kunci Jawaban:"
     * agar tidak ikut menjadi isi soal.
     */

    text =
        text.replace(
            /Kunci\s+Jawaban\s*:\s*[A-D]\.?\s*[^\s]*/gi,
            ""
        );


    text =
        normalisasiSpasi(
            text
        );


    /* =====================================================
       CEK NOMOR SOAL
    ===================================================== */

    const questionMatch =
        text.match(
            /^(\d+)[\.\)]\s*(.*)$/
        );


    if (questionMatch) {

        const nomor =
            questionMatch[1];

        const isi =
            questionMatch[2];


        const question = {

            nomor: nomor,

            text: "",

            images: [],

            options: [],

            jenis: "pilihan"

        };


        questions.push(
            question
        );


        setCurrentQuestion(
            question
        );


        /*
         * Proses isi setelah nomor soal.
         * Bisa saja langsung mengandung A-D.
         */

        prosesIsiDanPilihan(
            isi,
            images,
            question
        );


        return;

    }


    /* =====================================================
       JIKA BUKAN NOMOR SOAL
    ===================================================== */

    const currentQuestion =
        getCurrentQuestion();


    if (!currentQuestion) {
        return;
    }


    /*
     * Kalau baris ini mengandung pilihan A-D,
     * pisahkan.
     */

    if (
        containsOptionMarker(text)
    ) {

        prosesIsiDanPilihan(
            text,
            images,
            currentQuestion
        );

    } else {

        /*
         * Baris lanjutan soal
         */

        if (text) {

            currentQuestion.text +=
                (
                    currentQuestion.text
                    ? " "
                    : ""
                ) +
                text;

        }


        currentQuestion.images.push(
            ...images
        );

    }

}


/* =========================================================
   PROSES ISI + PILIHAN
========================================================= */

function prosesIsiDanPilihan(
    text,
    images,
    question
) {

    /*
     * Kita mencari A. B. C. D.
     *
     * Contoh:
     *
     * Lambang bilangan ... adalah ....
     * A. 75.402 B. 75.420 C. 75.042 D. 75.240
     *
     * Akan menjadi:
     *
     * pertanyaan
     * A = 75.402
     * B = 75.420
     * C = 75.042
     * D = 75.240
     */


    const optionRegex =
        /(?:^|\s)([A-D])[\.\)]\s*/gi;


    const matches = [];


    let match;


    while (
        (match =
            optionRegex.exec(text))
        !== null
    ) {

        matches.push({

            label:
                match[1].toUpperCase(),

            start:
                match.index +
                (
                    match[0].startsWith(" ")
                        ? 1
                        : 0
                ),

            contentStart:
                optionRegex.lastIndex

        });

    }


    /*
     * Jika tidak ada A-D,
     * berarti seluruh teks adalah soal.
     */

    if (matches.length === 0) {

        if (text) {

            question.text +=
                (
                    question.text
                        ? " "
                        : ""
                ) +
                text;

        }


        question.images.push(
            ...images
        );

        return;

    }


    /*
     * Bagian sebelum A = teks soal
     */

    const questionPart =
        text.substring(
            0,
            matches[0].start
        ).trim();


    if (questionPart) {

        question.text +=
            (
                question.text
                    ? " "
                    : ""
            ) +
            questionPart;

    }


    /*
     * Gambar pada paragraf ini
     * untuk sementara dikaitkan dengan soal.
     *
     * Ini aman untuk gambar yang berada
     * di paragraf pertanyaan.
     */

    if (matches.length > 0) {

        question.images.push(
            ...images
        );

    }


    /*
     * Pisahkan setiap pilihan
     */

    for (
        let i = 0;
        i < matches.length;
        i++
    ) {

        const current =
            matches[i];


        const next =
            matches[i + 1];


        const end =
            next
                ? next.start
                : text.length;


        let optionText =
            text.substring(
                current.contentStart,
                end
            ).trim();


        /*
         * Buang teks "Kunci Jawaban"
         * kalau masih tersisa.
         */

        optionText =
            optionText.replace(
                /Kunci\s+Jawaban\s*:?.*$/i,
                ""
            ).trim();


        /*
         * Hindari duplikasi pilihan
         */

        const alreadyExists =
            question.options.some(
                option =>
                    option.label ===
                    current.label
            );


        if (
            !alreadyExists
        ) {

            question.options.push({

                label:
                    current.label,

                text:
                    optionText,

                images: []

            });

        }

    }

}


/* =========================================================
   CEK APAKAH ADA A-D
========================================================= */

function containsOptionMarker(text) {

    return /(?:^|\s)[A-D][\.\)]\s+/i.test(
        text
    );

}


/* =========================================================
   TAMPILKAN PREVIEW
========================================================= */

function tampilkanPreview(
    questions
) {

    const section =
        document.getElementById(
            "previewSection"
        );


    const content =
        document.getElementById(
            "previewContent"
        );


    const count =
        document.getElementById(
            "questionCount"
        );


    section.style.display =
        "block";


    content.innerHTML = "";


    if (
        !questions ||
        questions.length === 0
    ) {

        content.innerHTML =
            '<div class="empty">' +
            "Tidak ada soal yang berhasil dikenali." +
            "</div>";


        count.textContent =
            "0 Soal";


        return;

    }


    count.textContent =
        questions.length +
        " Soal";


    questions.forEach(
        question => {

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "question";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "question-title";


            title.textContent =
                "Soal " +
                question.nomor;


            const body =
                document.createElement(
                    "div"
                );


            body.className =
                "question-body";


            const questionText =
                document.createElement(
                    "div"
                );


            questionText.className =
                "question-text";


            questionText.textContent =
                question.text;


            body.appendChild(
                questionText
            );


            /*
             * Gambar soal
             */

            question.images.forEach(
                src => {

                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        src;


                    questionText.appendChild(
                        img
                    );

                }
            );


            /*
             * Pilihan jawaban
             */

            question.options.forEach(
                option => {

                    const optionDiv =
                        document.createElement(
                            "div"
                        );


                    optionDiv.className =
                        "option";


                    const label =
                        document.createElement(
                            "span"
                        );


                    label.className =
                        "option-label";


                    label.textContent =
                        option.label +
                        ".";


                    optionDiv.appendChild(
                        label
                    );


                    const textSpan =
                        document.createElement(
                            "span"
                        );


                    textSpan.textContent =
                        " " +
                        option.text;


                    optionDiv.appendChild(
                        textSpan
                    );


                    /*
                     * Gambar pilihan
                     */

                    option.images.forEach(
                        src => {

                            const img =
                                document.createElement(
                                    "img"
                                );


                            img.src =
                                src;


                            optionDiv.appendChild(
                                img
                            );

                        }
                    );


                    body.appendChild(
                        optionDiv
                    );

                }
            );


            box.appendChild(
                title
            );


            box.appendChild(
                body
            );


            content.appendChild(
                box
            );

        }
    );

}

/* =========================================================
   IMAGE MIME
========================================================= */

function getImageMime(
    filename
) {

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();


    const mimeTypes = {

        jpg:
            "image/jpeg",

        jpeg:
            "image/jpeg",

        png:
            "image/png",

        gif:
            "image/gif",

        bmp:
            "image/bmp",

        webp:
            "image/webp",

        svg:
            "image/svg+xml"

    };


    return (
        mimeTypes[extension] ||
        "application/octet-stream"
    );

}


/* =========================================================
   BLOB → DATA URL
========================================================= */

function blobToDataUrl(
    blob,
    mime
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                new Blob(
                    [blob],
                    {
                        type: mime
                    }
                )
            );

        }
    );

}


/* =========================================================
   FORMAT UKURAN FILE
========================================================= */

function formatBytes(
    bytes
) {

    if (
        bytes === 0
    ) {

        return "0 Bytes";

    }


    const units = [

        "Bytes",

        "KB",

        "MB",

        "GB"

    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (

        parseFloat(

            (
                bytes /
                Math.pow(
                    1024,
                    i
                )
            ).toFixed(2)

        ) +

        " " +

        units[i]

    );

}


/* =========================================================
   NORMALISASI SPASI
========================================================= */

function normalisasiSpasi(
    text
) {

    return String(text || "")
        .replace(
            /\u00A0/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
