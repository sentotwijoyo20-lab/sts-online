<script>

/* =========================================================
   VARIABEL
========================================================= */

let hasilImport = [];


/* =========================================================
   EVENT PILIH FILE
========================================================= */

document.getElementById("wordFile").addEventListener("change", function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    bacaFileWord(file);

});


/* =========================================================
   BACA FILE DOCX
========================================================= */

async function bacaFileWord(file) {

    sembunyikanPesan();

    const loading =
        document.getElementById("loading");

    const fileInfo =
        document.getElementById("fileInfo");

    fileInfo.style.display = "block";

    fileInfo.innerHTML =
        "📄 <strong>File:</strong> " +
        escapeHtml(file.name) +
        "<br>" +
        "📦 <strong>Ukuran:</strong> " +
        formatBytes(file.size);

    loading.style.display = "block";


    try {

        const arrayBuffer =
            await file.arrayBuffer();

        const zip =
            await JSZip.loadAsync(arrayBuffer);

        const documentFile =
            zip.file("word/document.xml");

        if (!documentFile) {
            throw new Error(
                "Dokumen Word tidak memiliki document.xml."
            );
        }

        const documentXmlText =
            await documentFile.async("text");

        const parser =
            new DOMParser();

        const xml =
            parser.parseFromString(
                documentXmlText,
                "application/xml"
            );

        const parserError =
            xml.querySelector("parsererror");

        if (parserError) {
            throw new Error(
                "Struktur XML Word tidak dapat dibaca."
            );
        }


        /* =====================================================
           RELASI GAMBAR
        ===================================================== */

        const rels = {};

        const relsFile =
            zip.file(
                "word/_rels/document.xml.rels"
            );

        if (relsFile) {

            const relsText =
                await relsFile.async("text");

            const relsXml =
                parser.parseFromString(
                    relsText,
                    "application/xml"
                );

            const relationshipNodes =
                relsXml.getElementsByTagName(
                    "Relationship"
                );

            for (
                const rel of relationshipNodes
            ) {

                const id =
                    rel.getAttribute("Id");

                const target =
                    rel.getAttribute("Target");

                if (id && target) {

                    rels[id] =
                        target.replace(
                            /^.*media\//,
                            ""
                        );

                }

            }

        }


        /* =====================================================
           BACA GAMBAR
        ===================================================== */

        const images = {};

        for (
            const filename of Object.keys(zip.files)
        ) {

            if (
                !filename.startsWith(
                    "word/media/"
                )
            ) {
                continue;
            }

            const imageFile =
                zip.file(filename);

            if (!imageFile) {
                continue;
            }

            const blob =
                await imageFile.async("blob");

            const mime =
                getImageMime(filename);

            const dataUrl =
                await blobToDataUrl(
                    blob,
                    mime
                );

            const shortName =
                filename.replace(
                    "word/media/",
                    ""
                );

            images[shortName] =
                dataUrl;

        }


        /* =====================================================
           AMBIL SEMUA PARAGRAF
           BAGIAN INI DIKEMBALIKAN SEPERTI VERSI
           YANG SEBELUMNYA SUDAH BERHASIL MEMBACA
           SEMUA NOMOR DAN GAMBAR.
        ===================================================== */

        const paragraphs =
            Array.from(
                xml.getElementsByTagName(
                    "w:p"
                )
            );

        const data = [];

        for (
            const paragraph of paragraphs
        ) {

            const item =
                await prosesParagraf(
                    paragraph,
                    rels,
                    images
                );

            if (
                item.text.trim() !== "" ||
                item.images.length > 0
            ) {

                data.push(item);

            }

        }


        loading.style.display = "none";


        /*
         * PARSER LAMA TETAP DIGUNAKAN SEBAGAI
         * DASAR PEMBACAAN NOMOR SOAL.
         */

        const questions =
            parseSoalDariParagraf(
                data
            );


        hasilImport =
            questions;


        tampilkanPreview(
            questions
        );


        tampilkanSukses(
            "File Word berhasil dibaca. " +
            "Ditemukan " +
            questions.length +
            " soal."
        );


    } catch (error) {

        loading.style.display = "none";

        tampilkanError(
            "Gagal membaca file Word: " +
            error.message
        );

        console.error(error);

    }

}


/* =========================================================
   PROSES PARAGRAF
========================================================= */

async function prosesParagraf(
    paragraph,
    rels,
    images
) {

    let text = "";

    const textNodes =
        paragraph.getElementsByTagName(
            "w:t"
        );

    for (
        const node of textNodes
    ) {

        text +=
            node.textContent || "";

    }


    const imageElements = [];

    const blips =
        paragraph.getElementsByTagName(
            "a:blip"
        );

    for (
        const blip of blips
    ) {

        const relationId =
            blip.getAttribute(
                "r:embed"
            );

        if (!relationId) {
            continue;
        }

        const filename =
            rels[relationId];

        if (!filename) {
            continue;
        }

        if (images[filename]) {

            imageElements.push(
                images[filename]
            );

        }

    }


    return {
        text: text,
        images: imageElements
    };

}


/* =========================================================
   PARSER SOAL
   DASARNYA SAMA SEPERTI VERSI AWAL
========================================================= */

function parseSoalDariParagraf(data) {

    let nomor = 0;

    let currentQuestion = null;

    const questions = [];


    for (
        const item of data
    ) {

        let text =
            normalisasiSpasi(
                item.text
            );


        /* =====================================================
           DETEKSI NOMOR SOAL
        ===================================================== */

        const match =
            text.match(
                /^(\d+)[\.\)]\s*(.*)$/
            );


        if (match) {

            nomor++;

            currentQuestion = {

                nomor:
                    match[1],

                text:
                    "",

                images:
                    [...item.images],

                options:
                    [],

                kunci:
                    ""

            };


            questions.push(
                currentQuestion
            );


            /*
             * Bagian setelah nomor langsung diproses.
             * Ini yang membuat soal seperti:
             *
             * 1. Pertanyaan...
             *
             * tetap terbaca.
             */

            prosesIsiParagraf(
                match[2],
                [],
                currentQuestion
            );


            continue;

        }


        /* =====================================================
           PARAGRAF LANJUTAN
        ===================================================== */

        if (!currentQuestion) {
            continue;
        }


        prosesIsiParagraf(
            text,
            item.images,
            currentQuestion
        );

    }


    return questions;

}


/* =========================================================
   PROSES ISI PARAGRAF
========================================================= */

function prosesIsiParagraf(
    text,
    images,
    question
) {

    if (!text && images.length === 0) {
        return;
    }


    /* =====================================================
       CARI KUNCI JAWABAN
    ===================================================== */

    const keyMatch =
        text.match(
            /Kunci\s+Jawaban\s*:\s*([A-D])(?:[\.\)]|\b)/i
        );


    if (keyMatch) {

        question.kunci =
            keyMatch[1].toUpperCase();


        /*
         * Hapus bagian "Kunci Jawaban: A"
         * dari teks.
         */

        text =
            text.replace(
                /Kunci\s+Jawaban\s*:\s*[A-D](?:[\.\)]|\b)/i,
                ""
            );


        text =
            normalisasiSpasi(
                text
            );

    }


    /* =====================================================
       CARI PILIHAN A-D
    ===================================================== */

    const optionRegex =
        /(?:^|\s)([A-D])[\.\)]\s*/gi;


    const matches = [];

    let match;


    while (
        (match =
            optionRegex.exec(text))
        !== null
    ) {

        matches.push({

            label:
                match[1].toUpperCase(),

            start:
                match.index +
                (
                    match[0].startsWith(" ")
                        ? 1
                        : 0
                ),

            contentStart:
                optionRegex.lastIndex

        });

    }


    /* =====================================================
       TIDAK ADA A-D
       → PARAGRAF INI ADALAH TEKS SOAL
       ATAU LANJUTAN SOAL
    ===================================================== */

    if (
        matches.length === 0
    ) {

        if (text) {

            question.text +=
                (
                    question.text
                        ? " "
                        : ""
                ) +
                text;

        }


        question.images.push(
            ...images
        );


        return;

    }


    /* =====================================================
       TEKS SEBELUM A = PERTANYAAN
    ===================================================== */

    const beforeOptions =
        text.substring(
            0,
            matches[0].start
        ).trim();


    if (beforeOptions) {

        question.text +=
            (
                question.text
                    ? " "
                    : ""
            ) +
            beforeOptions;

    }


    /*
     * Jika gambar ada di paragraf yang sama
     * dengan pertanyaan + pilihan, tetap
     * dianggap gambar pertanyaan.
     */

    question.images.push(
        ...images
    );


    /* =====================================================
       PECAH PILIHAN
    ===================================================== */

    for (
        let i = 0;
        i < matches.length;
        i++
    ) {

        const current =
            matches[i];

        const next =
            matches[i + 1];


        const end =
            next
                ? next.start
                : text.length;


        let optionText =
            text.substring(
                current.contentStart,
                end
            ).trim();


        /*
         * Kalau Kunci Jawaban berada di akhir,
         * hapus sisa teks tersebut.
         */

        optionText =
            optionText.replace(
                /Kunci\s+Jawaban\s*:?.*$/i,
                ""
            ).trim();


        /*
         * Jika pilihan belum ada,
         * masukkan.
         */

        const existing =
            question.options.find(
                option =>
                    option.label ===
                    current.label
            );


        if (!existing) {

            question.options.push({

                label:
                    current.label,

                text:
                    optionText,

                images:
                    []

            });

        }

    }

}


/* =========================================================
   TAMPILKAN PREVIEW
========================================================= */

function tampilkanPreview(
    questions
) {

    const section =
        document.getElementById(
            "previewSection"
        );

    const content =
        document.getElementById(
            "previewContent"
        );

    const count =
        document.getElementById(
            "questionCount"
        );


    section.style.display =
        "block";


    content.innerHTML =
        "";


    if (
        !questions ||
        questions.length === 0
    ) {

        content.innerHTML =
            '<div class="empty">' +
            "Tidak ada soal yang berhasil dibaca." +
            "</div>";

        count.textContent =
            "0 Soal";

        return;

    }


    count.textContent =
        questions.length +
        " Soal";


    questions.forEach(
        question => {

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "question";


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "question-title";

            title.textContent =
                "Soal " +
                question.nomor;


            const body =
                document.createElement(
                    "div"
                );

            body.className =
                "question-body";


            const questionText =
                document.createElement(
                    "div"
                );

            questionText.className =
                "question-text";


            questionText.textContent =
                question.text;


            body.appendChild(
                questionText
            );


            /* =================================================
               GAMBAR PERTANYAAN
            ================================================= */

            question.images.forEach(
                src => {

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        src;

                    questionText.appendChild(
                        img
                    );

                }
            );


            /* =================================================
               PILIHAN
            ================================================= */

            question.options.forEach(
                option => {

                    const optionDiv =
                        document.createElement(
                            "div"
                        );

                    optionDiv.className =
                        "option";


                    const label =
                        document.createElement(
                            "span"
                        );

                    label.className =
                        "option-label";

                    label.textContent =
                        option.label +
                        ".";


                    optionDiv.appendChild(
                        label
                    );


                    const textSpan =
                        document.createElement(
                            "span"
                        );

                    textSpan.textContent =
                        " " +
                        option.text;


                    optionDiv.appendChild(
                        textSpan
                    );


                    option.images.forEach(
                        src => {

                            const img =
                                document.createElement(
                                    "img"
                                );

                            img.src =
                                src;

                            optionDiv.appendChild(
                                img
                            );

                        }
                    );


                    body.appendChild(
                        optionDiv
                    );

                }
            );


            /* =================================================
               KUNCI
               Hanya ditampilkan kalau memang ada.
            ================================================= */

            if (question.kunci) {

                const keyInfo =
                    document.createElement(
                        "div"
                    );

                keyInfo.style.marginTop =
                    "14px";

                keyInfo.style.padding =
                    "10px 12px";

                keyInfo.style.borderRadius =
                    "8px";

                keyInfo.style.background =
                    "#f0fdf4";

                keyInfo.style.color =
                    "#166534";

                keyInfo.style.fontWeight =
                    "bold";

                keyInfo.textContent =
                    "🔑 Kunci Jawaban: " +
                    question.kunci;


                body.appendChild(
                    keyInfo
                );

            }


            box.appendChild(
                title
            );

            box.appendChild(
                body
            );

            content.appendChild(
                box
            );

        }
    );

}

    if (
        !hasilImport ||
        hasilImport.length === 0
    ) {

        alert(

        );

        return;

    }


    localStorage.setItem(
        "bankSoal",
        JSON.stringify(
            hasilImport
        )
    );


    tampilkanSukses(
        "✅ Soal berhasil disimpan ke Bank Soal browser."
    );


    alert(
        "Soal berhasil disimpan ke Bank Soal."
    );

}

/* =========================================================
   IMAGE MIME
========================================================= */

function getImageMime(
    filename
) {

    const extension =
        filename
            .split(".")
            .pop()
            .toLowerCase();


    const mimeTypes = {

        jpg:
            "image/jpeg",

        jpeg:
            "image/jpeg",

        png:
            "image/png",

        gif:
            "image/gif",

        bmp:
            "image/bmp",

        webp:
            "image/webp",

        svg:
            "image/svg+xml"

    };


    return (
        mimeTypes[extension] ||
        "application/octet-stream"
    );

}


/* =========================================================
   BLOB → DATA URL
========================================================= */

function blobToDataUrl(
    blob,
    mime
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                new Blob(
                    [blob],
                    {
                        type: mime
                    }
                )
            );

        }
    );

}


/* =========================================================
   FORMAT UKURAN FILE
========================================================= */

function formatBytes(
    bytes
) {

    if (
        bytes === 0
    ) {

        return "0 Bytes";

    }


    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (

        parseFloat(

            (
                bytes /
                Math.pow(
                    1024,
                    i
                )
            ).toFixed(2)

        ) +

        " " +

        units[i]

    );

}


/* =========================================================
   NORMALISASI SPASI
========================================================= */

function normalisasiSpasi(
    text
) {

    return String(
        text || ""
    )
        .replace(
            /\u00A0/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
