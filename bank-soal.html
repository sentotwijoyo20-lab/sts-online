<main class="container">

<script>

/* ================================================= */
/* VARIABEL GLOBAL */
/* ================================================= */

let bankSoal = [];

let gambarWord = {};



/* ================================================= */
/* ELEMEN HTML */
/* ================================================= */

const wordFile =
    document.getElementById("wordFile");

const fileInfo =
    document.getElementById("fileInfo");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const preview =
    document.getElementById("preview");

const summary =
    document.getElementById("summary");

const saveButton =
    document.getElementById("saveButton");



/* ================================================= */
/* UPLOAD FILE */
/* ================================================= */

wordFile.addEventListener(
    "change",
    async function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }


        resetPesan();


        fileInfo.style.display =
            "block";

        fileInfo.innerHTML =
            "📄 <strong>" +
            escapeHtml(file.name) +
            "</strong>";


        loading.style.display =
            "block";


        try {

            await bacaFileWord(file);

        } catch (error) {

            console.error(error);

            tampilkanError(
                "File Word tidak dapat diproses. Pastikan file berformat .docx yang valid."
            );

        } finally {

            loading.style.display =
                "none";

        }

    }
);



/* ================================================= */
/* RESET PESAN */
/* ================================================= */

function resetPesan() {

    errorBox.style.display =
        "none";

    successBox.style.display =
        "none";

    loading.style.display =
        "none";

}



/* ================================================= */
/* BACA WORD */
/* ================================================= */

async function bacaFileWord(file) {

    if (
        !file.name
            .toLowerCase()
            .endsWith(".docx")
    ) {

        throw new Error(
            "File bukan DOCX."
        );

    }


    const arrayBuffer =
        await file.arrayBuffer();


    const zip =
        await JSZip.loadAsync(
            arrayBuffer
        );


    const documentXml =
        await zip
            .file("word/document.xml")
            .async("string");


    let relsXml = "";

    const relsFile =
        zip.file(
            "word/_rels/document.xml.rels"
        );


    if (relsFile) {

        relsXml =
            await relsFile.async(
                "string"
            );

    }


    gambarWord =
        await ambilGambar(
            zip,
            relsXml
        );


    const paragraphs =
        ekstrakParagraphWord(
            documentXml,
            relsXml
        );


    bankSoal =
        parseSoal(paragraphs);


    if (
        bankSoal.length === 0
    ) {

        throw new Error(
            "Tidak ditemukan soal. Pastikan dokumen menggunakan format PILIHAN GANDA / ISIAN SINGKAT / URAIAN."
        );

    }


    tampilkanPreview();

}



/* ================================================= */
/* AMBIL GAMBAR DARI WORD */
/* ================================================= */

async function ambilGambar(
    zip,
    relsXml
) {

    const hasil = {};

    if (!relsXml) {
        return hasil;
    }


    const parser =
        new DOMParser();

    const xml =
        parser.parseFromString(
            relsXml,
            "application/xml"
        );


    const rels =
        Array.from(
            xml.getElementsByTagName(
                "Relationship"
            )
        );


    for (
        const rel of rels
    ) {

        const id =
            rel.getAttribute(
                "Id"
            );

        const target =
            rel.getAttribute(
                "Target"
            );


        if (
            !id ||
            !target ||
            !target.includes(
                "media/"
            )
        ) {

            continue;

        }


        const namaFile =
            target
                .split("/")
                .pop();


        const file =
            zip.file(
                "word/media/" +
                namaFile
            );


        if (!file) {
            continue;
        }


        const blob =
            await file.async(
                "blob"
            );


        hasil[id] =
            URL.createObjectURL(
                blob
            );

    }


    return hasil;

}



/* ================================================= */
/* EKSTRAK PARAGRAF WORD */
/* ================================================= */

function ekstrakParagraphWord(
    xmlText,
    relsXml
) {

    const parser =
        new DOMParser();

    const xml =
        parser.parseFromString(
            xmlText,
            "application/xml"
        );


    const paragraphs =
        Array.from(
            xml.getElementsByTagName(
                "w:p"
            )
        );


    return paragraphs.map(
        function(p) {

            const textParts = [];

            const images = [];


            /*
             * Ambil seluruh teks
             */

            const textNodes =
                Array.from(
                    p.getElementsByTagName(
                        "w:t"
                    )
                );


            textNodes.forEach(
                function(node) {

                    textParts.push(
                        node.textContent || ""
                    );

                }
            );


            /*
             * Cari ID gambar
             */

            const blips =
                Array.from(
                    p.getElementsByTagName(
                        "a:blip"
                    )
                );


            blips.forEach(
                function(blip) {

                    const rid =
                        blip.getAttribute(
                            "r:embed"
                        );


                    if (
                        rid &&
                        gambarWord[rid]
                    ) {

                        images.push(
                            gambarWord[rid]
                        );

                    }

                }
            );


            /*
             * Beberapa dokumen Word
             * menggunakan namespace tanpa
             * prefix yang sama.
             */

            if (
                images.length === 0
            ) {

                const allElements =
                    Array.from(
                        p.getElementsByTagName("*")
                    );


                allElements.forEach(
                    function(element) {

                        const embed =
                            element.getAttribute(
                                "r:embed"
                            );


                        if (
                            embed &&
                            gambarWord[embed]
                        ) {

                            if (
                                !images.includes(
                                    gambarWord[embed]
                                )
                            ) {

                                images.push(
                                    gambarWord[embed]
                                );

                            }

                        }

                    }
                );

            }


            return {

                text:
                    normalisasiText(
                        textParts.join("")
                    ),

                images:
                    images

            };

        }
    );

}



/* ================================================= */
/* NORMALISASI TEKS */
/* ================================================= */

function normalisasiText(text) {

    return text

        .replace(
            /\u00A0/g,
            " "
        )

        .replace(
            /\u200B/g,
            ""
        )

        .replace(
            /\r/g,
            ""
        )

        .replace(
            /[ \t]+/g,
            " "
        )

        .trim();

}



/* ================================================= */
/* DETEKSI BAGIAN */
/* ================================================= */

function deteksiBagian(text) {

    const t =
        normalisasiText(text)
            .toUpperCase();


    /*
     * KUNCI JAWABAN
     * Harus diperiksa paling awal.
     */

    if (
        t.includes("KUNCI JAWABAN")
    ) {

        return "kunci";

    }


    /*
     * PILIHAN GANDA
     */

    if (
        t === "PILIHAN GANDA" ||
        t.includes("PILIHAN GANDA")
    ) {

        return "pg";

    }


    /*
     * ISIAN
     */

    if (
        t === "ISIAN SINGKAT" ||
        t.includes("ISIAN SINGKAT")
    ) {

        return "isian";

    }


    /*
     * URAIAN
     */

    if (
        t === "URAIAN" ||
        t.includes("SOAL URAIAN")
    ) {

        return "uraian";

    }


    /*
     * Heading otomatis Word
     * seperti:
     * I. Pilihan Ganda
     * II. Isian Singkat
     * III. Uraian
     */

    if (
        /^I[\.\):\-]\s*/.test(t) &&
        !/^II/.test(t) &&
        !/^III/.test(t)
    ) {

        if (
            t.includes("PILIH")
        ) {

            return "pg";

        }

    }


    if (
        /^II[\.\):\-]\s*/.test(t)
    ) {

        if (
            t.includes("ISI")
        ) {

            return "isian";

        }

    }


    if (
        /^III[\.\):\-]\s*/.test(t)
    ) {

        if (
            t.includes("URAI")
        ) {

            return "uraian";

        }

    }


    return null;

}



/* ================================================= */
/* DETEKSI NOMOR SOAL */
/* ================================================= */

function deteksiNomor(text) {

    const hasil =
        text.match(
            /^\s*(\d+)[\.\)\-]\s+(.+)$/s
        );


    if (!hasil) {
        return null;
    }


    return {

        nomor:
            parseInt(
                hasil[1],
                10
            ),

        isi:
            hasil[2].trim()

    };

}



/* ================================================= */
/* DETEKSI PILIHAN */
/* ================================================= */

function deteksiPilihan(text) {

    const hasil =
        text.match(
            /^\s*([A-Da-d])[\.\)\:\-]\s*(.*)$/s
        );


    if (!hasil) {
        return null;
    }


    return {

        huruf:
            hasil[1].toUpperCase(),

        isi:
            hasil[2].trim()

    };

}



/* ================================================= */
/* PARSER SOAL */
/* ================================================= */

function parseSoal(paragraphs) {

    const hasil = [];

    let bagian =
        null;

    let soalAktif =
        null;

    let nomorTerakhir =
        null;


    function simpanSoalAktif() {

        if (!soalAktif) {
            return;
        }


        /*
         * Jangan simpan paragraf kosong
         * sebagai soal.
         */

        const teks =
            soalAktif.pertanyaan
                .trim();


        if (
            teks ||
            soalAktif.images.length > 0
        ) {

            hasil.push(
                soalAktif
            );

        }


        soalAktif =
            null;

    }



    paragraphs.forEach(
        function(paragraph) {

            const text =
                paragraph.text;


            /*
             * 1. Cek heading bagian
             */

            const bagianBaru =
                deteksiBagian(text);


            if (
                bagianBaru === "kunci"
            ) {

                /*
                 * Kunci jawaban adalah
                 * batas akhir soal.
                 */

                simpanSoalAktif();

                bagian =
                    "kunci";

                return;

            }


            if (
                bagianBaru
            ) {

                simpanSoalAktif();

                bagian =
                    bagianBaru;

                nomorTerakhir =
                    null;

                return;

            }


            /*
             * Kalau sudah masuk kunci,
             * jangan baca apa pun lagi.
             */

            if (
                bagian === "kunci"
            ) {

                return;

            }


            /*
             * Belum menemukan jenis soal.
             */

            if (!bagian) {
                return;
            }


            /*
             * 2. Cek nomor soal
             */

            const nomor =
                deteksiNomor(text);


            if (nomor) {

                /*
                 * Nomor baru berarti
                 * soal baru.
                 */

                simpanSoalAktif();


                soalAktif = {

                    nomor:
                        nomor.nomor,

                    jenis:
                        bagian,

                    pertanyaan:
                        nomor.isi,

                    pilihan: {},

                    images:
                        [...paragraph.images]

                };


                nomorTerakhir =
                    nomor.nomor;


                return;

            }


            /*
             * 3. Cek pilihan A-D
             */

            if (
                soalAktif &&
                bagian === "pg"
            ) {

                const pilihan =
                    deteksiPilihan(
                        text
                    );


                if (pilihan) {

                    soalAktif.pilihan[
                        pilihan.huruf
                    ] =
                        pilihan.isi;


                    /*
                     * Jika paragraf pilihan
                     * memiliki gambar,
                     * simpan sebagai gambar
                     * pilihan.
                     */

                    if (
                        paragraph.images.length
                    ) {

                        if (
                            !soalAktif
                                .pilihanImages
                        ) {

                            soalAktif
                                .pilihanImages =
                                {};

                        }


                        soalAktif
                            .pilihanImages[
                                pilihan.huruf
                            ] =
                            [
                                ...paragraph.images
                            ];

                    }


                    return;

                }

            }


            /*
             * 4. Teks lanjutan
             *
             * Contoh:
             *
             * 2. Perhatikan gambar berikut!
             *
             * [gambar]
             *
             * Harga yang tertera pada
             * gambar di atas dibaca ....
             *
             * Semua tetap menjadi satu soal.
             */

            if (soalAktif) {

                if (text) {

                    soalAktif.pertanyaan +=
                        "\n" +
                        text;

                }


                if (
                    paragraph.images.length
                ) {

                    soalAktif.images.push(
                        ...paragraph.images
                    );

                }

            }

        }
    );


    /*
     * Simpan soal terakhir.
     */

    simpanSoalAktif();


    /*
     * Bersihkan data pilihan
     * dan buang soal yang tidak valid.
     */

    return hasil
        .filter(
            function(soal) {

                return (
                    soal.pertanyaan.trim() !== ""
                );

            }
        )
        .map(
            function(soal) {

                return {

                    nomor:
                        soal.nomor,

                    jenis:
                        soal.jenis,

                    pertanyaan:
                        soal.pertanyaan.trim(),

                    pilihan:
                        soal.pilihan || {},

                    images:
                        soal.images || [],

                    pilihanImages:
                        soal.pilihanImages || {}

                };

            }
        );

}



/* ================================================= */
/* PREVIEW */
/* ================================================= */

function tampilkanPreview() {

    preview.innerHTML =
        "";


    if (
        bankSoal.length === 0
    ) {

        preview.innerHTML =
            '<div class="empty-preview">' +
            'Tidak ada soal yang ditemukan.' +
            '</div>';

        saveButton.style.display =
            "none";

        summary.style.display =
            "none";

        return;

    }


    const jumlahPG =
        bankSoal.filter(
            soal =>
                soal.jenis === "pg"
        ).length;


    const jumlahIsian =
        bankSoal.filter(
            soal =>
                soal.jenis === "isian"
        ).length;


    const jumlahUraian =
        bankSoal.filter(
            soal =>
                soal.jenis === "uraian"
        ).length;


    document.getElementById(
        "jumlahPG"
    ).textContent =
        jumlahPG;


    document.getElementById(
        "jumlahIsian"
    ).textContent =
        jumlahIsian;


    document.getElementById(
        "jumlahUraian"
    ).textContent =
        jumlahUraian;


    summary.style.display =
        "grid";


    saveButton.style.display =
        "inline-block";


    /*
     * Kelompokkan berdasarkan jenis.
     */

    const kelompok =
        [
            {
                jenis: "pg",
                judul: "PILIHAN GANDA"
            },
            {
                jenis: "isian",
                judul: "ISIAN SINGKAT"
            },
            {
                jenis: "uraian",
                judul: "URAIAN"
            }
        ];


    let nomorGlobal =
        0;


    kelompok.forEach(
        function(kelompokData) {

            const daftar =
                bankSoal.filter(
                    function(soal) {

                        return soal.jenis ===
                            kelompokData.jenis;

                    }
                );


            if (
                daftar.length === 0
            ) {

                return;

            }


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "section-title";


            title.textContent =
                kelompokData.judul +
                " • " +
                daftar.length +
                " soal";


            preview.appendChild(
                title
            );


            daftar.forEach(
                function(soal) {

                    nomorGlobal++;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "question-card";


                    const header =
                        document.createElement(
                            "div"
                        );


                    header.className =
                        "question-header";


                    const nomor =
                        document.createElement(
                            "span"
                        );


                    nomor.className =
                        "question-number";


                    nomor.textContent =
                        "Soal " +
                        nomorGlobal;


                    const type =
                        document.createElement(
                            "span"
                        );


                    type.className =
                        "question-type";


                    type.textContent =
                        labelJenis(
                            soal.jenis
                        );


                    header.appendChild(
                        nomor
                    );


                    header.appendChild(
                        type
                    );


                    card.appendChild(
                        header
                    );


                    /*
                     * Pertanyaan
                     */

                    const questionText =
                        document.createElement(
                            "div"
                        );


                    questionText.className =
                        "question-text";


                    questionText.textContent =
                        soal.pertanyaan;


                    card.appendChild(
                        questionText
                    );


                    /*
                     * Gambar pertanyaan
                     */

                    soal.images.forEach(
                        function(src) {

                            const img =
                                document.createElement(
                                    "img"
                                );


                            img.src =
                                src;

                            img.className =
                                "question-image";

                            img.alt =
                                "Gambar soal";


                            card.appendChild(
                                img
                            );

                        }
                    );


                    /*
                     * Pilihan
                     */

                    if (
                        soal.jenis ===
                        "pg"
                    ) {

                        [
                            "A",
                            "B",
                            "C",
                            "D"
                        ].forEach(
                            function(huruf) {

                                if (
                                    !Object
                                        .prototype
                                        .hasOwnProperty
                                        .call(
                                            soal.pilihan,
                                            huruf
                                        )
                                ) {

                                    return;

                                }


                                const option =
                                    document.createElement(
                                        "div"
                                    );


                                option.className =
                                    "option";


                                const letter =
                                    document.createElement(
                                        "span"
                                    );


                                letter.className =
                                    "option-letter";


                                letter.textContent =
                                    huruf + ".";


                                const text =
                                    document.createElement(
                                        "span"
                                    );


                                text.textContent =
                                    soal.pilihan[
                                        huruf
                                    ];


                                option.appendChild(
                                    letter
                                );


                                option.appendChild(
                                    text
                                );


                                card.appendChild(
                                    option
                                );


                                /*
                                 * Gambar pilihan
                                 */

                                const optionImages =
                                    soal
                                        .pilihanImages &&
                                    soal
                                        .pilihanImages[
                                            huruf
                                        ];


                                if (
                                    optionImages
                                ) {

                                    optionImages
                                        .forEach(
                                            function(
                                                src
                                            ) {

                                                const img =
                                                    document
                                                        .createElement(
                                                            "img"
                                                        );


                                                img.src =
                                                    src;

                                                img.className =
                                                    "question-image";

                                                img.alt =
                                                    "Gambar pilihan";


                                                card
                                                    .appendChild(
                                                        img
                                                    );

                                            }
                                        );

                                }

                            }
                        );

                    }


                    preview.appendChild(
                        card
                    );

                }
            );

        }
    );



    successBox.style.display =
        "block";


    successBox.innerHTML =
        "✅ Berhasil membaca <strong>" +
        bankSoal.length +
        " soal</strong> dari file Word. " +
        "Kop, petunjuk, dan bagian setelah KUNCI JAWABAN tidak dimasukkan ke preview.";

}



/* ================================================= */
/* LABEL JENIS */
/* ================================================= */

function labelJenis(jenis) {

    if (
        jenis === "pg"
    ) {

        return "Pilihan Ganda";

    }


    if (
        jenis === "isian"
    ) {

        return "Isian Singkat";

    }


    if (
        jenis === "uraian"
    ) {

        return "Uraian";

    }


    return "Soal";

}



/* ================================================= */
/* SIMPAN BANK SOAL */
/* ================================================= */

function simpanBankSoal() {

    if (
        bankSoal.length === 0
    ) {

        alert(
            "Belum ada soal untuk disimpan."
        );

        return;

    }


    localStorage.setItem(
        "bankSoal",
        JSON.stringify(
            bankSoal
        )
    );


    alert(
        "Bank soal berhasil disimpan.\n\n" +
        "Jumlah soal: " +
        bankSoal.length
    );

}



/* ================================================= */
/* ERROR */
/* ================================================= */

function tampilkanError(message) {

    errorBox.style.display =
        "block";


    errorBox.textContent =
        "❌ " +
        message;


    preview.innerHTML =
        '<div class="empty-preview">' +
        'Tidak ada soal yang ditampilkan.' +
        '</div>';


    summary.style.display =
        "none";


    saveButton.style.display =
        "none";

}



/* ================================================= */
/* ESCAPE HTML */
/* ================================================= */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>
