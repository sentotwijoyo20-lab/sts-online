<main class="container">

        <h2>

<script>


/* ================================================= */
/* VARIABEL */
/* ================================================= */

let bankSoal = [];

let gambarWord = {};



/* ================================================= */
/* ELEMEN */
/* ================================================= */

const wordFile =
    document.getElementById("wordFile");

const fileInfo =
    document.getElementById("fileInfo");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const preview =
    document.getElementById("preview");

const summary =
    document.getElementById("summary");

const saveButton =
    document.getElementById("saveButton");



/* ================================================= */
/* UPLOAD */
/* ================================================= */

wordFile.addEventListener(
    "change",
    async function () {

        const file =
            this.files[0];


        if (!file) {
            return;
        }


        resetPesan();


        fileInfo.style.display =
            "block";


        fileInfo.innerHTML =
            "📄 <strong>" +
            escapeHtml(file.name) +
            "</strong><br>" +
            "📦 Ukuran: " +
            formatUkuran(file.size);


        loading.style.display =
            "block";


        try {

            await bacaFileWord(file);

        } catch (error) {

            console.error(
                error
            );


            tampilkanError(
                error.message ||
                "File Word tidak dapat diproses."
            );

        } finally {

            loading.style.display =
                "none";

        }

    }
);



/* ================================================= */
/* RESET PESAN */
/* ================================================= */

function resetPesan() {

    errorBox.style.display =
        "none";

    successBox.style.display =
        "none";

}



/* ================================================= */
/* UKURAN FILE */
/* ================================================= */

function formatUkuran(
    bytes
) {

    if (
        bytes < 1024
    ) {

        return bytes + " B";

    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(2) +
        " KB";

    }


    return (
        bytes /
        (1024 * 1024)
    ).toFixed(2) +
    " MB";

}



/* ================================================= */
/* BACA WORD */
/* ================================================= */

async function bacaFileWord(
    file
) {

    const buffer =
        await file.arrayBuffer();


    const zip =
        await JSZip.loadAsync(
            buffer
        );


    const documentFile =
        zip.file(
            "word/document.xml"
        );


    if (!documentFile) {

        throw new Error(
            "document.xml tidak ditemukan."
        );

    }


    const documentXml =
        await documentFile.async(
            "string"
        );


    let relsXml =
        "";


    const relsFile =
        zip.file(
            "word/_rels/document.xml.rels"
        );


    if (relsFile) {

        relsXml =
            await relsFile.async(
                "string"
            );

    }


    gambarWord =
        await ambilGambar(
            zip,
            relsXml
        );


    const paragraphs =
        ekstrakParagraphWord(
            documentXml
        );


    bankSoal =
        parseSoal(
            paragraphs
        );


    /*
     * ============================================
     * FILTER AKHIR
     *
     * INI SANGAT PENTING.
     *
     * PG HARUS MEMILIKI PILIHAN A-D.
     * ============================================
     */

    bankSoal =
        bankSoal.filter(
            function (soal) {

                if (
                    soal.jenis ===
                    "pg"
                ) {

                    const jumlahPilihan =
                        Object.keys(
                            soal.pilihan
                        ).length;


                    return (
                        jumlahPilihan >= 4
                    );

                }


                return true;

            }
        );


    /*
     * Nomor dibuat ulang setelah filter.
     */

    penomoranUlang();


    console.log(
        "BANK SOAL FINAL:",
        bankSoal
    );


    if (
        bankSoal.length === 0
    ) {

        throw new Error(
            "Tidak ditemukan soal yang valid."
        );

    }


    tampilkanPreview();

}



/* ================================================= */
/* GAMBAR */
/* ================================================= */

async function ambilGambar(
    zip,
    relsXml
) {

    const hasil = {};


    if (!relsXml) {
        return hasil;
    }


    const parser =
        new DOMParser();


    const xml =
        parser.parseFromString(
            relsXml,
            "application/xml"
        );


    const rels =
        Array.from(
            xml.getElementsByTagName(
                "Relationship"
            )
        );


    for (
        const rel of rels
    ) {

        const id =
            rel.getAttribute(
                "Id"
            );


        const target =
            rel.getAttribute(
                "Target"
            );


        if (
            !id ||
            !target ||
            !target.includes(
                "media/"
            )
        ) {

            continue;

        }


        const namaFile =
            target
                .split("/")
                .pop();


        const imageFile =
            zip.file(
                "word/media/" +
                namaFile
            );


        if (!imageFile) {
            continue;
        }


        const blob =
            await imageFile.async(
                "blob"
            );


        hasil[id] =
            URL.createObjectURL(
                blob
            );

    }


    return hasil;

}



/* ================================================= */
/* EKSTRAK PARAGRAF WORD */
/* ================================================= */

function ekstrakParagraphWord(
    xmlText
) {

    const parser =
        new DOMParser();


    const xml =
        parser.parseFromString(
            xmlText,
            "application/xml"
        );


    const paragraphs =
        Array.from(
            xml.getElementsByTagName(
                "w:p"
            )
        );


    return paragraphs.map(
        function (p) {

            let text = "";


            const elements =
                Array.from(
                    p.getElementsByTagName(
                        "*"
                    )
                );


            elements.forEach(
                function (element) {

                    if (
                        element.localName ===
                        "t"
                    ) {

                        text +=
                            element.textContent ||
                            "";

                    }


                    if (
                        element.localName ===
                        "br"
                    ) {

                        text +=
                            "\n";

                    }


                    if (
                        element.localName ===
                        "tab"
                    ) {

                        text +=
                            "\t";

                    }

                }
            );


            let hasNumbering =
                false;


            let numId =
                null;


            let ilvl =
                null;


            const numPr =
                p.getElementsByTagName(
                    "w:numPr"
                )[0];


            if (numPr) {

                hasNumbering =
                    true;


                const numIdNode =
                    numPr.getElementsByTagName(
                        "w:numId"
                    )[0];


                const ilvlNode =
                    numPr.getElementsByTagName(
                        "w:ilvl"
                    )[0];


                if (numIdNode) {

                    numId =
                        numIdNode.getAttribute(
                            "w:val"
                        );

                }


                if (ilvlNode) {

                    ilvl =
                        ilvlNode.getAttribute(
                            "w:val"
                        );

                }

            }


            const images = [];


            elements.forEach(
                function (element) {

                    const embed =
                        element.getAttribute(
                            "r:embed"
                        );


                    if (
                        embed &&
                        gambarWord[embed]
                    ) {

                        if (
                            !images.includes(
                                gambarWord[embed]
                            )
                        ) {

                            images.push(
                                gambarWord[embed]
                            );

                        }

                    }

                }
            );


            return {

                text:
                    normalisasiText(
                        text
                    ),

                images:
                    images,

                hasNumbering:
                    hasNumbering,

                numId:
                    numId,

                ilvl:
                    ilvl

            };

        }
    );

}



/* ================================================= */
/* NORMALISASI */
/* ================================================= */

function normalisasiText(
    text
) {

    return String(text)

        .replace(
            /\u00A0/g,
            " "
        )

        .replace(
            /\u200B/g,
            ""
        )

        .replace(
            /[ \t]+/g,
            " "
        )

        .replace(
            / *\n */g,
            "\n"
        )

        .trim();

}



/* ================================================= */
/* DETEKSI BAGIAN */
/* ================================================= */

function deteksiBagian(
    text
) {

    const t =
        normalisasiText(
            text
        )
        .toUpperCase();


    if (
        t.includes(
            "KUNCI JAWABAN"
        )
    ) {

        return "kunci";

    }


    if (
        t === "PILIHAN GANDA" ||
        t.includes(
            "PILIHAN GANDA"
        )
    ) {

        return "pg";

    }


    if (
        t === "ISIAN SINGKAT" ||
        t.includes(
            "ISIAN SINGKAT"
        )
    ) {

        return "isian";

    }


    if (
        t === "URAIAN" ||
        t.includes(
            "SOAL URAIAN"
        )
    ) {

        return "uraian";

    }


    return null;

}



/* ================================================= */
/* NOMOR */
/* ================================================= */

function deteksiNomor(
    text
) {

    const hasil =
        normalisasiText(
            text
        ).match(
            /^(\d+)[\.\)\-:]\s*(.*)$/s
        );


    if (!hasil) {

        return null;

    }


    return {

        nomor:
            parseInt(
                hasil[1],
                10
            ),

        isi:
            hasil[2].trim()

    };

}



/* ================================================= */
/* PILIHAN */
/* ================================================= */

function deteksiPilihan(
    text
) {

    const hasil =
        normalisasiText(
            text
        ).match(
            /^([A-Da-d])[\.\)\:\-]\s*(.*)$/s
        );


    if (!hasil) {

        return null;

    }


    return {

        huruf:
            hasil[1].toUpperCase(),

        isi:
            hasil[2].trim()

    };

}



/* ================================================= */
/* NUMBERING OTOMATIS */
/* ================================================= */

function adalahNomorOtomatisSoal(
    paragraph,
    bagian
) {

    if (
        !paragraph.hasNumbering
    ) {

        return false;

    }


    if (
        paragraph.ilvl !== null &&
        paragraph.ilvl !== "0"
    ) {

        return false;

    }


    if (
        !paragraph.text.trim()
    ) {

        return false;

    }


    if (
        deteksiPilihan(
            paragraph.text
        )
    ) {

        return false;

    }


    if (
        deteksiBagian(
            paragraph.text
        )
    ) {

        return false;

    }


    return (
        bagian === "pg" ||
        bagian === "isian" ||
        bagian === "uraian"
    );

}



/* ================================================= */
/* PARSER */
/* ================================================= */

function parseSoal(
    paragraphs
) {

    const hasil = [];


    let bagian =
        null;


    let soalAktif =
        null;


    /*
     * Menyimpan soal aktif.
     */

    function simpanSoalAktif() {

        if (
            !soalAktif
        ) {

            return;

        }


        const pertanyaan =
            normalisasiText(
                soalAktif.pertanyaan
            );


        if (
            pertanyaan ||
            soalAktif.images.length > 0
        ) {

            hasil.push({

                nomor:
                    soalAktif.nomor,

                jenis:
                    soalAktif.jenis,

                pertanyaan:
                    pertanyaan,

                pilihan:
                    soalAktif.pilihan,

                images:
                    soalAktif.images,

                pilihanImages:
                    soalAktif.pilihanImages

            });

        }


        soalAktif =
            null;

    }



    paragraphs.forEach(
        function (paragraph) {

            const text =
                paragraph.text;


            /*
             * =====================================
             * HEADING
             * =====================================
             */

            const bagianBaru =
                deteksiBagian(
                    text
                );


            if (
                bagianBaru === "kunci"
            ) {

                simpanSoalAktif();

                bagian =
                    "kunci";

                return;

            }


            if (
                bagianBaru
            ) {

                simpanSoalAktif();

                bagian =
                    bagianBaru;

                return;

            }


            /*
             * Jika benar-benar ada heading
             * KUNCI JAWABAN, abaikan sisanya.
             */

            if (
                bagian === "kunci"
            ) {

                return;

            }


            /*
             * =====================================
             * NOMOR TERTULIS
             * =====================================
             */

            const nomor =
                deteksiNomor(
                    text
                );


            /*
             * =====================================
             * NUMBERING OTOMATIS
             * =====================================
             */

            const otomatis =
                adalahNomorOtomatisSoal(
                    paragraph,
                    bagian
                );


            /*
             * =====================================
             * PILIHAN A-D
             * =====================================
             */

            if (
                soalAktif &&
                bagian === "pg"
            ) {

                const pilihan =
                    deteksiPilihan(
                        text
                    );


                if (
                    pilihan
                ) {

                    soalAktif.pilihan[
                        pilihan.huruf
                    ] =
                        pilihan.isi;


                    if (
                        paragraph.images.length > 0
                    ) {

                        soalAktif
                            .pilihanImages[
                                pilihan.huruf
                            ] =
                            [
                                ...paragraph.images
                            ];

                    }


                    return;

                }

            }


            /*
             * =====================================
             * NOMOR SOAL TERTULIS
             * =====================================
             */

            if (
                nomor
            ) {

                /*
                 * Jangan membuat soal baru
                 * jika nomor tersebut ternyata
                 * adalah kunci PG.
                 *
                 * Kunci PG seperti:
                 *
                 * 26. D
                 *
                 * tidak mempunyai pilihan A-D.
                 */

                if (
                    bagian === "pg" &&
                    /^[A-Da-d]$/.test(
                        nomor.isi
                    )
                ) {

                    /*
                     * Abaikan kunci.
                     */

                    return;

                }


                /*
                 * Untuk Isian/Uraian, kita
                 * gunakan nomor dan isi.
                 */

                simpanSoalAktif();


                soalAktif = {

                    nomor:
                        nomor.nomor,

                    jenis:
                        bagian,

                    pertanyaan:
                        nomor.isi,

                    pilihan:
                        {},

                    images:
                        [
                            ...paragraph.images
                        ],

                    pilihanImages:
                        {}

                };


                return;

            }


            /*
             * =====================================
             * NOMOR OTOMATIS
             * =====================================
             */

            if (
                otomatis
            ) {

                /*
                 * Jika PG dan isi hanya
                 * A-D, itu kunci jawaban.
                 */

                if (
                    bagian === "pg" &&
                    /^[A-Da-d]$/.test(
                        text
                    )
                ) {

                    return;

                }


                /*
                 * Kalau PG aktif sudah
                 * mempunyai A-D lengkap,
                 * lalu muncul paragraf otomatis
                 * berisi satu huruf A-D,
                 * abaikan.
                 */

                if (
                    bagian === "pg" &&
                    soalAktif &&
                    Object.keys(
                        soalAktif.pilihan
                    ).length >= 4 &&
                    /^[A-Da-d]$/.test(
                        text
                    )
                ) {

                    return;

                }


                simpanSoalAktif();


                const jumlahSebelumnya =
                    hasil.filter(
                        function (item) {

                            return (
                                item.jenis ===
                                bagian
                            );

                        }
                    ).length;


                soalAktif = {

                    nomor:
                        jumlahSebelumnya + 1,

                    jenis:
                        bagian,

                    pertanyaan:
                        text,

                    pilihan:
                        {},

                    images:
                        [
                            ...paragraph.images
                        ],

                    pilihanImages:
                        {}

                };


                return;

            }


            /*
             * =====================================
             * LANJUTAN TEKS SOAL
             * =====================================
             */

            if (
                soalAktif
            ) {

                if (
                    text
                ) {

                    soalAktif.pertanyaan +=
                        "\n" +
                        text;

                }


                if (
                    paragraph.images.length > 0
                ) {

                    soalAktif.images.push(
                        ...paragraph.images
                    );

                }

            }

        }
    );


    simpanSoalAktif();


    return hasil;

}



/* ================================================= */
/* PENOMORAN ULANG */
/* ================================================= */

function penomoranUlang() {

    let nomor =
        1;


    bankSoal.forEach(
        function (soal) {

            soal.nomor =
                nomor;

            nomor++;

        }
    );

}



/* ================================================= */
/* PREVIEW */
/* ================================================= */

function tampilkanPreview() {

    preview.innerHTML =
        "";


    const jumlahPG =
        bankSoal.filter(
            function (soal) {

                return soal.jenis ===
                    "pg";

            }
        ).length;


    const jumlahIsian =
        bankSoal.filter(
            function (soal) {

                return soal.jenis ===
                    "isian";

            }
        ).length;


    const jumlahUraian =
        bankSoal.filter(
            function (soal) {

                return soal.jenis ===
                    "uraian";

            }
        ).length;


    document.getElementById(
        "jumlahPG"
    ).textContent =
        jumlahPG;


    document.getElementById(
        "jumlahIsian"
    ).textContent =
        jumlahIsian;


    document.getElementById(
        "jumlahUraian"
    ).textContent =
        jumlahUraian;


    summary.style.display =
        "grid";


    saveButton.style.display =
        "inline-block";



    /*
     * ============================================
     * KELOMPOK
     * ============================================
     */

    const kelompok = [

        {
            jenis: "pg",
            judul: "PILIHAN GANDA"
        },

        {
            jenis: "isian",
            judul: "ISIAN SINGKAT"
        },

        {
            jenis: "uraian",
            judul: "URAIAN"
        }

    ];


    let nomorGlobal =
        0;


    kelompok.forEach(
        function (kelompokData) {

            const daftar =
                bankSoal.filter(
                    function (soal) {

                        return soal.jenis ===
                            kelompokData.jenis;

                    }
                );


            if (
                daftar.length === 0
            ) {

                return;

            }


            const sectionTitle =
                document.createElement(
                    "div"
                );


            sectionTitle.className =
                "section-title";


            sectionTitle.textContent =
                kelompokData.judul +
                " • " +
                daftar.length +
                " soal";


            preview.appendChild(
                sectionTitle
            );


            daftar.forEach(
                function (soal) {

                    nomorGlobal++;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "question-card";


                    /*
                     * HEADER
                     */

                    const header =
                        document.createElement(
                            "div"
                        );


                    header.className =
                        "question-header";


                    const number =
                        document.createElement(
                            "span"
                        );


                    number.className =
                        "question-number";


                    number.textContent =
                        "Soal " +
                        nomorGlobal;


                    const type =
                        document.createElement(
                            "span"
                        );


                    type.className =
                        "question-type";


                    type.textContent =
                        labelJenis(
                            soal.jenis
                        );


                    header.appendChild(
                        number
                    );


                    header.appendChild(
                        type
                    );


                    card.appendChild(
                        header
                    );



                    /*
                     * PERTANYAAN
                     */

                    const questionText =
                        document.createElement(
                            "div"
                        );


                    questionText.className =
                        "question-text";


                    questionText.textContent =
                        soal.pertanyaan;


                    card.appendChild(
                        questionText
                    );



                    /*
                     * GAMBAR
                     */

                    soal.images.forEach(
                        function (src) {

                            const img =
                                document.createElement(
                                    "img"
                                );


                            img.src =
                                src;


                            img.className =
                                "question-image";


                            img.alt =
                                "Gambar soal";


                            card.appendChild(
                                img
                            );

                        }
                    );



                    /*
                     * PILIHAN
                     */

                    if (
                        soal.jenis ===
                        "pg"
                    ) {

                        [
                            "A",
                            "B",
                            "C",
                            "D"
                        ].forEach(
                            function (huruf) {

                                if (
                                    !Object
                                        .prototype
                                        .hasOwnProperty
                                        .call(
                                            soal.pilihan,
                                            huruf
                                        )
                                ) {

                                    return;

                                }


                                const option =
                                    document.createElement(
                                        "div"
                                    );


                                option.className =
                                    "option";


                                const letter =
                                    document.createElement(
                                        "span"
                                    );


                                letter.className =
                                    "option-letter";


                                letter.textContent =
                                    huruf + ".";


                                const optionText =
                                    document.createElement(
                                        "span"
                                    );


                                optionText.textContent =
                                    soal.pilihan[
                                        huruf
                                    ];


                                option.appendChild(
                                    letter
                                );


                                option.appendChild(
                                    optionText
                                );


                                card.appendChild(
                                    option
                                );


                                /*
                                 * GAMBAR PILIHAN
                                 */

                                const optionImages =
                                    soal
                                        .pilihanImages &&
                                    soal
                                        .pilihanImages[
                                            huruf
                                        ];


                                if (
                                    optionImages
                                ) {

                                    optionImages.forEach(
                                        function (
                                            src
                                        ) {

                                            const img =
                                                document
                                                    .createElement(
                                                        "img"
                                                    );


                                            img.src =
                                                src;


                                            img.className =
                                                "question-image";


                                            img.alt =
                                                "Gambar pilihan";


                                            card.appendChild(
                                                img
                                            );

                                        }
                                    );

                                }

                            }
                        );

                    }


                    preview.appendChild(
                        card
                    );

                }
            );

        }
    );


    /*
     * ============================================
     * PESAN
     * ============================================
     */

    successBox.style.display =
        "block";


    successBox.innerHTML =
        "✅ Berhasil membaca <strong>" +
        bankSoal.length +
        " soal</strong> dari file Word. " +
        "Kop, petunjuk, dan kunci jawaban " +
        "tidak dimasukkan ke preview.";

}



/* ================================================= */
/* LABEL JENIS */
/* ================================================= */

function labelJenis(
    jenis
) {

    if (
        jenis === "pg"
    ) {

        return "Pilihan Ganda";

    }


    if (
        jenis === "isian"
    ) {

        return "Isian Singkat";

    }


    if (
        jenis === "uraian"
    ) {

        return "Uraian";

    }


    return "Soal";

}



/* ================================================= */
/* SIMPAN */
/* ================================================= */

function simpanBankSoal() {

    if (
        bankSoal.length === 0
    ) {

        alert(
            "Belum ada soal untuk disimpan."
        );

        return;

    }


    localStorage.setItem(
        "bankSoal",
        JSON.stringify(
            bankSoal
        )
    );


    alert(
        "Bank soal berhasil disimpan.\n\n" +
        "Jumlah soal: " +
        bankSoal.length
    );

}



/* ================================================= */
/* ERROR */
/* ================================================= */

function tampilkanError(
    message
) {

    errorBox.style.display =
        "block";


    errorBox.textContent =
        "❌ " +
        message;


    preview.innerHTML =
        '<div class="empty-preview">' +
        'Tidak ada soal yang ditampilkan.' +
        '</div>';


    summary.style.display =
        "none";


    saveButton.style.display =
        "none";

}



/* ================================================= */
/* ESCAPE HTML */
/* ================================================= */

function escapeHtml(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
