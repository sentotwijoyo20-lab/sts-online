<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Soal - STS Online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #0f4c81, #2563eb);
            color: white;
            padding: 22px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 6px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .page-title h2 {
            margin: 0;
            font-size: 25px;
        }

        .page-title p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        .btn-back {
            border: none;
            background: #e5e7eb;
            color: #374151;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #d1d5db;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #111827;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 11px 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .option-row {
            display: grid;
            grid-template-columns: 45px 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .option-label {
            background: #eff6ff;
            color: #1d4ed8;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }

        .answer-box {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }

        .answer-box p {
            margin-top: 0;
            font-weight: bold;
        }

        .radio-group {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .radio-item input {
            width: auto;
        }

        .btn-save {
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .btn-save:hover {
            background: #1d4ed8;
        }

        .filter-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .soal-item {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            background: #fff;
        }

        .soal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 12px;
        }

        .soal-number {
            font-weight: bold;
            color: #2563eb;
        }

        .soal-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-mapel {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-kelas {
            background: #dcfce7;
            color: #15803d;
        }

        .soal-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .pilihan-list {
            display: grid;
            gap: 8px;
        }

        .pilihan {
            padding: 9px 12px;
            background: #f9fafb;
            border-radius: 7px;
            border: 1px solid #e5e7eb;
        }

        .pilihan.benar {
            background: #dcfce7;
            border-color: #86efac;
            color: #166534;
            font-weight: bold;
        }

        .soal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }

        .jawaban-benar {
            color: #15803d;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 8px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-delete:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .count-box {
            margin-bottom: 18px;
            font-weight: bold;
            color: #374151;
        }

        @media (max-width: 700px) {
            .form-grid,
            .filter-bar {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .header {
                padding: 20px;
            }

            .container {
                margin-top: 20px;
                padding: 0 12px;
            }

            .card {
                padding: 18px;
            }

            .soal-header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-inner">
            <h1>🏫 STS ONLINE</h1>
            <p>SD Negeri 1 Jatipayak</p>
        </div>
    </header>

    <main class="container">

        <div class="top-bar">
            <div class="page-title">
                <h2>📚 Bank Soal</h2>
                <p>Kelola kumpulan soal untuk ujian.</p>
            </div>

            <button class="btn-back" onclick="kembali()">
                ← Kembali
            </button>
        </div>


        <!-- FORM TAMBAH SOAL -->

        <section class="card">

            <h3>➕ Tambah Soal Baru</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="mapel">Mata Pelajaran</label>

                    <select id="mapel">
                        <option value="">-- Pilih Mata Pelajaran --</option>
                        <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                        <option value="IPAS">IPAS</option>
                        <option value="Seni">Seni</option>
                        <option value="PJOK">PJOK</option>
                        <option value="Bahasa Inggris">Bahasa Inggris</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="kelas">Kelas</label>

                    <select id="kelas">
                        <option value="">-- Pilih Kelas --</option>
                        <option value="I">Kelas I</option>
                        <option value="II">Kelas II</option>
                        <option value="III">Kelas III</option>
                        <option value="IV">Kelas IV</option>
                        <option value="V">Kelas V</option>
                        <option value="VI">Kelas VI</option>
                    </select>
                </div>


                <div class="form-group full">
                    <label for="pertanyaan">Pertanyaan</label>

                    <textarea
                        id="pertanyaan"
                        placeholder="Tuliskan pertanyaan..."
                    ></textarea>
                </div>

            </div>


            <h3 style="margin-top:25px;">Pilihan Jawaban</h3>

            <div class="option-row">
                <div class="option-label">A</div>

                <input
                    type="text"
                    id="opsiA"
                    placeholder="Pilihan jawaban A"
                >
            </div>


            <div class="option-row">
                <div class="option-label">B</div>

                <input
                    type="text"
                    id="opsiB"
                    placeholder="Pilihan jawaban B"
                >
            </div>


            <div class="option-row">
                <div class="option-label">C</div>

                <input
                    type="text"
                    id="opsiC"
                    placeholder="Pilihan jawaban C"
                >
            </div>


            <div class="option-row">
                <div class="option-label">D</div>

                <input
                    type="text"
                    id="opsiD"
                    placeholder="Pilihan jawaban D"
                >
            </div>


            <div class="answer-box">

                <p>Jawaban yang benar</p>

                <div class="radio-group">

                    <label class="radio-item">
                        <input type="radio" name="jawaban" value="A">
                        A
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="jawaban" value="B">
                        B
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="jawaban" value="C">
                        C
                    </label>

                    <label class="radio-item">
                        <input type="radio" name="jawaban" value="D">
                        D
                    </label>

                </div>

            </div>


            <button class="btn-save" onclick="simpanSoal()">
                💾 Simpan Soal
            </button>

        </section>


        <!-- DAFTAR SOAL -->

        <section class="card">

            <h3>📖 Daftar Soal</h3>

            <div class="filter-bar">

                <select id="filterMapel" onchange="tampilkanSoal()">
                    <option value="">Semua Mata Pelajaran</option>
                    <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Pendidikan Pancasila">Pendidikan Pancasila</option>
                    <option value="IPAS">IPAS</option>
                    <option value="Seni">Seni</option>
                    <option value="PJOK">PJOK</option>
                    <option value="Bahasa Inggris">Bahasa Inggris</option>
                </select>


                <select id="filterKelas" onchange="tampilkanSoal()">
                    <option value="">Semua Kelas</option>
                    <option value="I">Kelas I</option>
                    <option value="II">Kelas II</option>
                    <option value="III">Kelas III</option>
                    <option value="IV">Kelas IV</option>
                    <option value="V">Kelas V</option>
                    <option value="VI">Kelas VI</option>
                </select>

            </div>


            <div id="jumlahSoal" class="count-box"></div>

            <div id="daftarSoal"></div>

        </section>

    </main>


    <script>

        const STORAGE_KEY = "bankSoalSTS";


        function ambilSoal() {

            const data = localStorage.getItem(STORAGE_KEY);

            if (!data) {
                return [];
            }

            try {
                return JSON.parse(data);
            } catch (error) {
                return [];
            }
        }


        function simpanDataSoal(data) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(data)
            );

        }


        function simpanSoal() {

            const mapel =
                document.getElementById("mapel").value;

            const kelas =
                document.getElementById("kelas").value;

            const pertanyaan =
                document.getElementById("pertanyaan").value.trim();

            const opsiA =
                document.getElementById("opsiA").value.trim();

            const opsiB =
                document.getElementById("opsiB").value.trim();

            const opsiC =
                document.getElementById("opsiC").value.trim();

            const opsiD =
                document.getElementById("opsiD").value.trim();


            const jawabanElement =
                document.querySelector(
                    'input[name="jawaban"]:checked'
                );


            if (mapel === "") {
                alert("Silakan pilih mata pelajaran.");
                return;
            }


            if (kelas === "") {
                alert("Silakan pilih kelas.");
                return;
            }


            if (pertanyaan === "") {
                alert("Silakan isi pertanyaan.");
                return;
            }


            if (
                opsiA === "" ||
                opsiB === "" ||
                opsiC === "" ||
                opsiD === ""
            ) {
                alert("Semua pilihan jawaban A-D harus diisi.");
                return;
            }


            if (!jawabanElement) {
                alert("Silakan tentukan jawaban yang benar.");
                return;
            }


            const soal = {

                id: Date.now(),

                mapel: mapel,

                kelas: kelas,

                pertanyaan: pertanyaan,

                pilihan: {

                    A: opsiA,

                    B: opsiB,

                    C: opsiC,

                    D: opsiD

                },

                jawaban: jawabanElement.value

            };


            const data = ambilSoal();

            data.push(soal);

            simpanDataSoal(data);


            alert("Soal berhasil disimpan.");


            bersihkanForm();

            tampilkanSoal();

        }


        function bersihkanForm() {

            document.getElementById("mapel").value = "";

            document.getElementById("kelas").value = "";

            document.getElementById("pertanyaan").value = "";

            document.getElementById("opsiA").value = "";

            document.getElementById("opsiB").value = "";

            document.getElementById("opsiC").value = "";

            document.getElementById("opsiD").value = "";


            const radios =
                document.querySelectorAll(
                    'input[name="jawaban"]'
                );


            radios.forEach(function(radio) {

                radio.checked = false;

            });

        }


        function tampilkanSoal() {

            const data = ambilSoal();

            const filterMapel =
                document.getElementById("filterMapel").value;

            const filterKelas =
                document.getElementById("filterKelas").value;


            const hasil = data.filter(function(soal) {

                const cocokMapel =
                    filterMapel === "" ||
                    soal.mapel === filterMapel;

                const cocokKelas =
                    filterKelas === "" ||
                    soal.kelas === filterKelas;

                return cocokMapel && cocokKelas;

            });


            const jumlahSoal =
                document.getElementById("jumlahSoal");


            jumlahSoal.textContent =
                "Total soal: " + hasil.length;


            const container =
                document.getElementById("daftarSoal");


            if (hasil.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📚</div>
                        <div>Belum ada soal.</div>
                    </div>
                `;

                return;

            }


            container.innerHTML = "";


            hasil.forEach(function(soal, index) {

                const item =
                    document.createElement("div");

                item.className = "soal-item";


                item.innerHTML = `

                    <div class="soal-header">

                        <div class="soal-number">
                            Soal ${index + 1}
                        </div>

                        <div class="soal-meta">

                            <span class="badge badge-mapel">
                                ${escapeHTML(soal.mapel)}
                            </span>

                            <span class="badge badge-kelas">
                                Kelas ${escapeHTML(soal.kelas)}
                            </span>

                        </div>

                    </div>


                    <div class="soal-text">
                        ${escapeHTML(soal.pertanyaan)}
                    </div>


                    <div class="pilihan-list">

                        <div class="pilihan ${soal.jawaban === "A" ? "benar" : ""}">
                            A. ${escapeHTML(soal.pilihan.A)}
                        </div>

                        <div class="pilihan ${soal.jawaban === "B" ? "benar" : ""}">
                            B. ${escapeHTML(soal.pilihan.B)}
                        </div>

                        <div class="pilihan ${soal.jawaban === "C" ? "benar" : ""}">
                            C. ${escapeHTML(soal.pilihan.C)}
                        </div>

                        <div class="pilihan ${soal.jawaban === "D" ? "benar" : ""}">
                            D. ${escapeHTML(soal.pilihan.D)}
                        </div>

                    </div>


                    <div class="soal-footer">

                        <div class="jawaban-benar">
                            ✓ Jawaban benar: ${soal.jawaban}
                        </div>

                        <button
                            class="btn-delete"
                            onclick="hapusSoal(${soal.id})"
                        >
                            🗑 Hapus
                        </button>

                    </div>

                `;


                container.appendChild(item);

            });

        }


        function hapusSoal(id) {

            const konfirmasi =
                confirm(
                    "Apakah Anda yakin ingin menghapus soal ini?"
                );


            if (!konfirmasi) {
                return;
            }


            const data = ambilSoal();


            const hasil =
                data.filter(function(soal) {

                    return soal.id !== id;

                });


            simpanDataSoal(hasil);

            tampilkanSoal();

        }


        function escapeHTML(text) {

            return String(text)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        function kembali() {

            window.location.href = "index.html";

        }


        tampilkanSoal();

    </script>

</body>
</html>
