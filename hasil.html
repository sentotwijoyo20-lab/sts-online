<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hasil Ujian - STS Online</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="result-container">

    <div class="result-card">

        <div class="result-icon">
            🎉
        </div>

        <h1>Hasil Ujian</h1>

        <p class="school-name">
            SD Negeri 1 Jatipayak
        </p>


        <!-- MODE -->

        <div
            id="modeHasil"
            class="mode-badge">
            🟢 GLADI / SIMULASI
        </div>


        <!-- DATA SISWA -->

        <div class="student-result">

            <p>
                <strong>Nama</strong>
                <span id="namaHasil">-</span>
            </p>

            <p>
                <strong>NIS</strong>
                <span id="nisHasil">-</span>
            </p>

        </div>


        <!-- NILAI -->

        <div class="score-box">

            <div class="score-label">
                NILAI
            </div>

            <div
                id="nilaiHasil"
                class="score">
                0
            </div>

        </div>


        <!-- DETAIL -->

        <div class="result-detail">

            <div class="detail-item">

                <span>Jumlah Soal</span>

                <strong id="jumlahSoalHasil">
                    0
                </strong>

            </div>


            <div class="detail-item">

                <span>Jawaban Benar</span>

                <strong id="benarHasil">
                    0
                </strong>

            </div>


            <div class="detail-item">

                <span>Jawaban Salah</span>

                <strong id="salahHasil">
                    0
                </strong>

            </div>

        </div>


        <!-- PESAN -->

        <div
            id="pesanHasil"
            class="result-message">
        </div>


        <!-- TOMBOL -->

        <div class="result-buttons">

            <button
                onclick="kembaliKeBeranda()"
                class="btn-primary">
                🏠 Kembali ke Beranda
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   DATA SISWA
===================================================== */

const nama =
    localStorage.getItem("namaSiswa")
    || "Siswa";


const nis =
    localStorage.getItem("nisSiswa")
    || "-";


/* =====================================================
   MODE
===================================================== */

const params =
    new URLSearchParams(window.location.search);


const mode =
    localStorage.getItem("hasilMode")
    || params.get("mode")
    || "gladi";


/* =====================================================
   AMBIL NILAI
===================================================== */

let nilai;
let benar;
let jumlahSoal;


/*
   PENTING:

   Nilai Gladi dan STS Resmi
   memiliki penyimpanan berbeda.
*/

if (mode === "resmi") {

    nilai =
        Number(
            localStorage.getItem("nilaiSTSResmi")
        );


    benar =
        Number(
            localStorage.getItem("jumlahBenarSTSResmi")
        );


    jumlahSoal =
        Number(
            localStorage.getItem("jumlahSoalSTSResmi")
        );

} else {

    nilai =
        Number(
            localStorage.getItem("nilaiGladi")
        );


    benar =
        Number(
            localStorage.getItem("jumlahBenarGladi")
        );


    jumlahSoal =
        Number(
            localStorage.getItem("jumlahSoalGladi")
        );

}


/* =====================================================
   HITUNG SALAH
===================================================== */

const salah =
    jumlahSoal - benar;


/* =====================================================
   TAMPILKAN DATA
===================================================== */

document.getElementById("namaHasil")
    .textContent = nama;


document.getElementById("nisHasil")
    .textContent = nis;


document.getElementById("nilaiHasil")
    .textContent = nilai;


document.getElementById("jumlahSoalHasil")
    .textContent = jumlahSoal;


document.getElementById("benarHasil")
    .textContent = benar;


document.getElementById("salahHasil")
    .textContent = salah;


/* =====================================================
   TAMPILKAN MODE
===================================================== */

const modeHasil =
    document.getElementById("modeHasil");


if (mode === "resmi") {

    modeHasil.textContent =
        "🔵 STS RESMI";


    modeHasil.classList.add(
        "mode-resmi"
    );

} else {

    modeHasil.textContent =
        "🟢 GLADI / SIMULASI";

}


/* =====================================================
   PESAN NILAI
===================================================== */

const pesan =
    document.getElementById("pesanHasil");


if (nilai === 100) {

    pesan.innerHTML =
        "🌟 Luar biasa! Semua jawaban benar.";

} else if (nilai >= 80) {

    pesan.innerHTML =
        "👏 Bagus! Terus pertahankan hasil belajarmu.";

} else if (nilai >= 60) {

    pesan.innerHTML =
        "💪 Sudah cukup baik. Mari belajar lagi.";

} else {

    pesan.innerHTML =
        "📚 Jangan menyerah. Tetap semangat belajar!";

}


/* =====================================================
   KEMBALI
===================================================== */

function kembaliKeBeranda() {

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
