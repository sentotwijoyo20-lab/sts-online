<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hasil Ujian - STS Online</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           RESET KHUSUS HALAMAN HASIL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(30, 136, 229, 0.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 188, 212, 0.12), transparent 35%),
                linear-gradient(135deg, #eef6ff, #f8fbff);
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .hasil-page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }


        /* =====================================================
           KARTU HASIL
        ===================================================== */

        .hasil-card {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 24px;
            padding: 42px 45px;
            box-shadow:
                0 20px 50px rgba(30, 60, 90, 0.14),
                0 5px 15px rgba(30, 60, 90, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
            text-align: center;
        }


        /* =====================================================
           ICON
        ===================================================== */

        .hasil-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #f1f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            box-shadow: 0 8px 20px rgba(30, 136, 229, 0.10);
        }


        /* =====================================================
           JUDUL
        ===================================================== */

        .hasil-card h1 {
            margin: 0;
            font-size: 36px;
            line-height: 1.2;
            color: #172b4d;
            font-weight: 800;
        }

        .hasil-school {
            margin: 10px 0 22px;
            color: #60758f;
            font-size: 18px;
            font-weight: 600;
        }


        /* =====================================================
           BADGE MODE
        ===================================================== */

        .hasil-mode {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            border-radius: 30px;
            background: #e8f7ed;
            color: #218838;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .hasil-mode.mode-resmi {
            background: #e7f1ff;
            color: #1769aa;
        }


        /* =====================================================
           PEMBATAS
        ===================================================== */

        .hasil-divider {
            width: 100%;
            height: 1px;
            background: #e8edf3;
            margin: 0 0 24px;
        }


        /* =====================================================
           DATA SISWA
        ===================================================== */

        .hasil-siswa {
            background: #f7faff;
            border: 1px solid #e5edf7;
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 25px;
            text-align: left;
        }

        .siswa-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 8px 0;
        }

        .siswa-label {
            color: #718096;
            font-size: 16px;
            font-weight: 600;
        }

        .siswa-value {
            color: #172b4d;
            font-size: 17px;
            font-weight: 800;
            text-align: right;
            word-break: break-word;
        }


        /* =====================================================
           BOX NILAI
        ===================================================== */

        .hasil-score-box {
            background: linear-gradient(135deg, #f1f8ff, #ffffff);
            border: 2px solid #dbeeff;
            border-radius: 22px;
            padding: 24px 20px 28px;
            margin-bottom: 25px;
        }

        .hasil-score-label {
            color: #58708c;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .hasil-score {
            color: #1769aa;
            font-size: 92px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -3px;
            margin: 5px 0;
        }


        /* =====================================================
           DETAIL
        ===================================================== */

        .hasil-detail {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .hasil-detail-item {
            background: #f8fafc;
            border: 1px solid #e8edf3;
            border-radius: 16px;
            padding: 18px 8px;
        }

        .hasil-detail-label {
            display: block;
            color: #718096;
            font-size: 13px;
            line-height: 1.3;
            margin-bottom: 9px;
            font-weight: 600;
        }

        .hasil-detail-number {
            display: block;
            color: #172b4d;
            font-size: 30px;
            line-height: 1;
            font-weight: 900;
        }


        /* =====================================================
           PESAN
        ===================================================== */

        .hasil-pesan {
            background: #fffaf0;
            border: 1px solid #f5e6bd;
            border-radius: 15px;
            padding: 17px 15px;
            margin-bottom: 25px;
            color: #725c20;
            font-size: 16px;
            line-height: 1.5;
            font-weight: 600;
        }


        /* =====================================================
           TOMBOL
        ===================================================== */

        .hasil-button {
            width: 100%;
            min-height: 56px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #1769aa, #2186d4);
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(23, 105, 170, 0.20);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .hasil-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 11px 24px rgba(23, 105, 170, 0.25);
        }

        .hasil-button:active {
            transform: translateY(0);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .hasil-footer {
            margin-top: 22px;
            color: #8a9aab;
            font-size: 13px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            .hasil-page {
                padding: 20px 14px;
            }

            .hasil-card {
                max-width: 100%;
                padding: 30px 20px;
                border-radius: 20px;
            }

            .hasil-icon {
                width: 70px;
                height: 70px;
                font-size: 38px;
                margin-bottom: 15px;
            }

            .hasil-card h1 {
                font-size: 29px;
            }

            .hasil-school {
                font-size: 16px;
                margin-bottom: 18px;
            }

            .hasil-mode {
                font-size: 13px;
                padding: 9px 15px;
                margin-bottom: 21px;
            }

            .hasil-siswa {
                padding: 15px 17px;
            }

            .siswa-row {
                gap: 12px;
            }

            .siswa-label {
                font-size: 14px;
            }

            .siswa-value {
                font-size: 15px;
            }

            .hasil-score-box {
                padding: 21px 15px 25px;
            }

            .hasil-score {
                font-size: 78px;
            }

            .hasil-detail {
                gap: 8px;
            }

            .hasil-detail-item {
                padding: 15px 5px;
            }

            .hasil-detail-label {
                font-size: 11px;
            }

            .hasil-detail-number {
                font-size: 26px;
            }

            .hasil-pesan {
                font-size: 14px;
            }

            .hasil-button {
                font-size: 16px;
            }
        }


        /* =====================================================
           HP SANGAT KECIL
        ===================================================== */

        @media (max-width: 380px) {

            .hasil-card {
                padding: 26px 15px;
            }

            .hasil-card h1 {
                font-size: 26px;
            }

            .hasil-score {
                font-size: 68px;
            }

            .siswa-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 3px;
            }

            .siswa-value {
                text-align: left;
            }

            .hasil-detail-label {
                font-size: 10px;
            }

            .hasil-detail-number {
                font-size: 23px;
            }
        }
    </style>
</head>


<body>

<div class="hasil-page">

    <div class="hasil-card">

        <!-- ICON -->

        <div class="hasil-icon">
            🎉
        </div>


        <!-- JUDUL -->

        <h1>Hasil Ujian</h1>

        <div class="hasil-school">
            SD Negeri 1 Jatipayak
        </div>


        <!-- MODE -->

        <div
            id="modeHasil"
            class="hasil-mode">
            🟢 GLADI / SIMULASI
        </div>


        <div class="hasil-divider"></div>


        <!-- DATA SISWA -->

        <div class="hasil-siswa">

            <div class="siswa-row">

                <span class="siswa-label">
                    Nama
                </span>

                <span
                    id="namaHasil"
                    class="siswa-value">
                    -
                </span>

            </div>


            <div class="siswa-row">

                <span class="siswa-label">
                    NIS / Nomor Peserta
                </span>

                <span
                    id="nisHasil"
                    class="siswa-value">
                    -
                </span>

            </div>

        </div>


        <!-- NILAI -->

        <div class="hasil-score-box">

            <div class="hasil-score-label">
                NILAI AKHIR
            </div>

            <div
                id="nilaiHasil"
                class="hasil-score">
                0
            </div>

        </div>


        <!-- DETAIL -->

        <div class="hasil-detail">

            <div class="hasil-detail-item">

                <span class="hasil-detail-label">
                    Jumlah Soal
                </span>

                <strong
                    id="jumlahSoalHasil"
                    class="hasil-detail-number">
                    0
                </strong>

            </div>


            <div class="hasil-detail-item">

                <span class="hasil-detail-label">
                    Jawaban Benar
                </span>

                <strong
                    id="benarHasil"
                    class="hasil-detail-number">
                    0
                </strong>

            </div>


            <div class="hasil-detail-item">

                <span class="hasil-detail-label">
                    Belum Dinilai
                </span>

                <strong
                    id="salahHasil"
                    class="hasil-detail-number">
                    0
                </strong>

            </div>

        </div>


        <!-- PESAN -->

        <div
            id="pesanHasil"
            class="hasil-pesan">
        </div>


        <!-- TOMBOL -->

        <button
            onclick="kembaliKeBeranda()"
            class="hasil-button">
            🏠 Kembali ke Beranda
        </button>


        <!-- FOOTER -->

        <div class="hasil-footer">
            STS ONLINE • SD Negeri 1 Jatipayak
        </div>

    </div>

</div>


<script>
/* =====================================================
   DATA SISWA
===================================================== */

const nama =
    localStorage.getItem("namaSiswa")
    || "Siswa";

const nis =
    localStorage.getItem("nisSiswa")
    || "-";


/* =====================================================
   MODE
===================================================== */

const params =
    new URLSearchParams(window.location.search);

const mode =
    params.get("mode")
    || localStorage.getItem("modeUjian")
    || "gladi";


/* =====================================================
   AMBIL HASIL UJIAN
===================================================== */

const nilai =
    Number(
        localStorage.getItem("nilaiSTS")
        || 0
    );

const benar =
    Number(
        localStorage.getItem("jumlahBenar")
        || 0
    );

const jumlahPG =
    Number(
        localStorage.getItem("jumlahSoalPG")
        || 0
    );

const jumlahIsian =
    Number(
        localStorage.getItem("jumlahSoalIsian")
        || 0
    );

const jumlahUraian =
    Number(
        localStorage.getItem("jumlahSoalUraian")
        || 0
    );

const jumlahSoal =
    jumlahPG +
    jumlahIsian +
    jumlahUraian;

const belumDinilai =
    jumlahUraian;


/* =====================================================
   TAMPILKAN DATA
===================================================== */

document.getElementById("namaHasil")
    .textContent = nama;

document.getElementById("nisHasil")
    .textContent = nis;

document.getElementById("nilaiHasil")
    .textContent = nilai;

document.getElementById("jumlahSoalHasil")
    .textContent = jumlahSoal;

document.getElementById("benarHasil")
    .textContent = benar;

document.getElementById("salahHasil")
    .textContent = belumDinilai;


/* =====================================================
   TAMPILKAN MODE
===================================================== */

const modeHasil =
    document.getElementById("modeHasil");

if (mode === "resmi") {

    modeHasil.textContent =
        "?? STS RESMI";

    modeHasil.classList.add(
        "mode-resmi"
    );

} else {

    modeHasil.textContent =
        "?? GLADI / SIMULASI";

}


/* =====================================================
   PESAN NILAI
===================================================== */

const pesan =
    document.getElementById("pesanHasil");

if (nilai === 100) {

    pesan.innerHTML =
        "?? Luar biasa! Semua soal otomatis berhasil dijawab.";

} else if (nilai >= 80) {

    pesan.innerHTML =
        "?? Bagus! Terus pertahankan hasil belajarmu.";

} else if (nilai >= 60) {

    pesan.innerHTML =
        "?? Sudah cukup baik. Mari belajar lagi.";

} else {

    pesan.innerHTML =
        "?? Jangan menyerah. Tetap semangat belajar!";

}


/* =====================================================
   KEMBALI
===================================================== */

function kembaliKeBeranda() {

    window.location.href =
        "index.html";

}
</script>

</body>
</html>
```
