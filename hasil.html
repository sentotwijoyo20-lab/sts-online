<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hasil Ujian - STS Online</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="result-page">


    <div class="result-card">


        <div class="result-icon">
            🎉
        </div>


        <h1>
            Ujian Selesai!
        </h1>


        <p
            id="namaHasil"
            class="result-name">

            Siswa

        </p>


        <div
            id="modeHasil"
            class="mode-badge mode-gladi">

            🟢 GLADI / SIMULASI

        </div>


        <div
            id="nilai"
            class="score">

            0

        </div>


        <div class="result-info">

            <p>
                Jawaban benar:
            </p>

            <strong id="benar">
                0 dari 0 soal
            </strong>

        </div>


        <a
            href="index.html"
            class="home-button">

            🏠 KEMBALI KE BERANDA

        </a>


    </div>

</div>


<script>


const nama =
    localStorage.getItem(
        "namaSiswa"
    ) || "Siswa";


const mode =
    localStorage.getItem(
        "modeUjian"
    ) || "gladi";


const nilai =
    localStorage.getItem(
        "nilaiSTS"
    ) || "0";


const benar =
    localStorage.getItem(
        "jumlahBenar"
    ) || "0";


const jumlah =
    localStorage.getItem(
        "jumlahSoal"
    ) || "0";


document.getElementById(
    "namaHasil"
).textContent =
    nama;


document.getElementById(
    "nilai"
).textContent =
    nilai;


document.getElementById(
    "benar"
).textContent =
    benar +
    " dari " +
    jumlah +
    " soal";


const modeHasil =
    document.getElementById(
        "modeHasil"
    );


if (mode === "resmi") {

    modeHasil.textContent =
        "🔵 STS RESMI";

    modeHasil.className =
        "mode-badge mode-resmi";

} else {

    modeHasil.textContent =
        "🟢 GLADI / SIMULASI";

    modeHasil.className =
        "mode-badge mode-gladi";

}

</script>


</body>

</html>
